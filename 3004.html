<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CNTL-3004 期中练习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen study tool. Sticky top bar (progress + filters), centred question card styled like an equipment rating plate, fixed bottom nav sized for thumbs. */
:root{
  --bg:#e9edf0; --surface:#ffffff; --surface-2:#f4f6f8; --ink:#16212c; --muted:#596876; --line:#cfd7de;
  --accent:#1d5bc9; --accent-ink:#ffffff; --accent-soft:#e2ebfb;
  --ok:#1d7f48; --ok-soft:#e1f3e8; --bad:#c2362b; --bad-soft:#fbe5e2; --warn:#9a5a00; --warn-soft:#fdf1dc; --star:#c98a00;
  --shadow:0 1px 2px rgba(22,33,44,.06),0 4px 16px rgba(22,33,44,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --fs:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1419; --surface:#161f27; --surface-2:#1c2731; --ink:#e4eaf0; --muted:#94a3b1; --line:#2a3743;
  --accent:#6ea3ff; --accent-ink:#0b1420; --accent-soft:#1a2b45;
  --ok:#4cc184; --ok-soft:#12301f; --bad:#ff8074; --bad-soft:#3a1916; --warn:#e7a94a; --warn-soft:#33240c; --star:#f0b72f;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1419; --surface:#161f27; --surface-2:#1c2731; --ink:#e4eaf0; --muted:#94a3b1; --line:#2a3743;
  --accent:#6ea3ff; --accent-ink:#0b1420; --accent-soft:#1a2b45;
  --ok:#4cc184; --ok-soft:#12301f; --bad:#ff8074; --bad-soft:#3a1916; --warn:#e7a94a; --warn-soft:#33240c; --star:#f0b72f;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:calc(15px * var(--fs));line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px;padding-block:10px 6px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:.02em;line-height:1;margin:0;white-space:nowrap}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:.04em;margin-top:3px}
.spacer{flex:1}
.seg{display:inline-flex;flex:none;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:6px;font-size:.85rem;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.topics{padding-top:12px}
.topics-head{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);margin-bottom:8px}
.topics-head b{color:var(--ink);font-weight:600}
.topics-head button{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 10px;font-size:.78rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .grp{flex-basis:100%;height:0}
/* 收起时：所有主题挤成一行，左右滑动查看 */
.chips.collapsed{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chips.collapsed .grp{display:none}
.chips.collapsed .chip{flex:none;white-space:nowrap}
[hidden]{display:none!important}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem;color:var(--muted);text-align:left;max-width:100%}
.chip b{font-family:var(--f-mono);font-weight:500;margin-left:4px;font-size:.75rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.prog{display:flex;align-items:center;gap:10px;padding-bottom:10px;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;display:flex;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-bad{background:var(--bad)}

/* main */
main{padding-block:12px calc(110px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.plate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px dashed var(--line);background:var(--surface-2);font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.plate .qn{font-family:var(--f-display);font-size:1.15rem;font-weight:700;color:var(--ink);letter-spacing:.03em}
.tag{border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:var(--surface);white-space:nowrap}
.tag.tf{border-color:var(--accent);color:var(--accent)}
.star{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;display:inline-flex;gap:5px;align-items:center;font-family:var(--f-body);font-size:.78rem;color:var(--muted)}
.star svg{width:15px;height:15px}
.star[aria-pressed="true"]{color:var(--star);border-color:var(--star)}
.star[aria-pressed="true"] svg{fill:var(--star)}
.qbody{padding:16px 16px 6px}
.qtext{font-size:1.12em;font-weight:500;margin:0;text-wrap:pretty}
.qtext.tap{cursor:pointer}
.qzh{margin:8px 0 0;color:var(--muted);font-size:.92em}
.ztip{display:inline-block;margin-top:8px;font-size:.75rem;color:var(--accent);border:1px dashed var(--accent);border-radius:4px;padding:1px 7px;background:none}
.opt .zh{display:block;margin-top:4px;font-size:.88em;color:var(--muted)}
.opt.right .zh,.opt.wrong .zh{color:inherit;opacity:.85}
.reveal{padding:0 16px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--muted)}
.reveal .btn{padding:6px 12px;font-size:.82rem}
.opts{display:grid;gap:10px;padding:14px 16px 16px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;min-height:52px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:.85rem;background:var(--surface-2);border:1px solid var(--line)}
.opt .t{flex:1;min-width:0;padding-top:1px}
.opt .m{flex:none;font-weight:600;font-size:.8rem;padding-top:3px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.right .m{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt.wrong .m{color:var(--bad)}
.opt.dim{opacity:.55}
.opt.tried-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.tried-wrong .k{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt.tried-wrong .m{color:var(--bad)}
.opt[disabled]{cursor:default}
.hint{padding:0 16px 14px;font-size:.78rem;color:var(--muted)}

.exp{border-top:1px solid var(--line);padding:14px 16px 16px;display:grid;gap:12px}
.verdict{display:flex;align-items:center;gap:8px;font-weight:600}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.verdict .redo{margin-left:auto;font-weight:500;font-size:.8rem;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;color:var(--muted)}
.exp p{margin:0}
.src{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pg{font-family:var(--f-mono);font-size:.8rem;font-weight:500;background:var(--ink);color:var(--surface);border-radius:4px;padding:2px 8px}
.badge{font-size:.75rem;border-radius:4px;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
.badge.cls{border-color:var(--accent);color:var(--accent)}
blockquote{margin:0;padding:10px 12px;border-left:3px solid var(--ink);background:var(--surface-2);border-radius:0 6px 6px 0;font-family:var(--f-mono);font-size:.82em;line-height:1.6;overflow-wrap:anywhere}
blockquote .tr{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-family:var(--f-body);font-size:1.05em;color:var(--ink)}
blockquote cite{display:block;font-style:normal;color:var(--muted);font-family:var(--f-body);font-size:.75rem;margin-bottom:4px}
.flag{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:.85em}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.nav .wrap{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.nbtn{height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.nbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nbtn[disabled]{opacity:.4;cursor:default}
.nbtn svg{width:18px;height:18px}
.gridbtn{height:48px;min-width:84px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-family:var(--f-mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.kbd{max-width:760px;margin:6px auto 0;padding-inline:16px;font-size:.72rem;color:var(--muted);text-align:center}
.brand{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.kbd{display:none}.seg button{padding:6px 8px}.brand small{display:none}.brand{font-size:1.15rem}.top-row{gap:8px}}
@media (max-width:360px){.brand{font-size:1rem}}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:14px 14px 0 0;max-height:82vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet-inner{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-family:var(--f-display);font-size:1.3rem;letter-spacing:.02em}
.sheet-body{overflow-y:auto;padding:14px 16px 18px;display:grid;gap:16px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);display:inline-block}
.secblock h3{margin:0 0 8px;font-size:.82rem;color:var(--muted);font-weight:600}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.cell{height:40px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:.8rem;position:relative;font-variant-numeric:tabular-nums}
.cell.c-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.c-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.c-ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell .mk{position:absolute;top:2px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--star)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;padding-block:6px;flex-wrap:wrap}
.row label{flex:1 1 180px;min-width:0}
.row label{font-weight:500}
.row .sub{display:block;font-size:.78rem;color:var(--muted);font-weight:400}
.switch{width:46px;height:28px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{left:21px;background:var(--accent-ink)}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.sectbl{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
.sectbl td,.sectbl th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.sectbl td:last-child,.sectbl th:last-child{text-align:right}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--f-display);color:var(--ink);margin:0 0 6px}

.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;max-width:380px;width:100%;padding:18px;display:grid;gap:12px;box-shadow:var(--shadow)}
.modal h3{margin:0;font-size:1.05rem}
.modal p{margin:0;color:var(--muted);font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:.85rem;z-index:60}
.timer{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="wrap">
    <div class="top-row">
      <h1 class="brand">CNTL-3004 期中练习<small>Unit 13 Controls · Ch.1–2</small></h1>

      <button class="icon-btn" id="btn-settings" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>

<script>
const SECTIONS = [
  {id:1, name:"阀组与调压器", en:"Valve train & regulators"},
  {id:2, name:"电路图与符号", en:"Diagrams & symbols"},
  {id:3, name:"继电器·极性·相位", en:"Relays, polarity, phasing"},
  {id:4, name:"点火控制与时序", en:"Ignition & sequence"},
  {id:5, name:"温控·限温·压控", en:"Operating & limit controls"},
  {id:6, name:"火焰保护·燃气压力开关", en:"Flame safeguard & gas pressure"},
  {id:7, name:"水阀与特殊燃气阀", en:"Water & specialty valves"}
];

/* a[0] is always the correct answer for MC; options are shuffled at runtime.
   TF questions: a = ["True","False"], c = index of correct, never shuffled.
   src: book = in textbook, class = teacher only, both = teacher + textbook */
const QUESTIONS = [
/* ---------- 1 ---------- */
{s:1, q:"The series of controls and components from the appliance main shut-off valve to the appliance burner is called the:",
 zh:"从器具主关断阀到燃烧器之间的一系列控制器和部件叫什么？",
 a:["Valve train (manifold assembly)","Service line","Branch line","Drip leg assembly"],
 e:"阀组（valve train，也叫 manifold assembly）就是从器具主关断阀到燃烧器之间的所有阀、控制器和管件。老师引用 B149.1 的定义：手动关断阀下游到燃烧器入口为止。",
 p:"83", qt:"The series of controls and components from the appliance main shut-off valve to the appliance burner is called the valve-train or manifold assembly.", src:"both"},

{s:1, q:"A building has a 2 psig gas service. The furnace appliance regulator is rated for a maximum inlet of 0.5 psig. What must be installed between them?",
 zh:"2 psi 进户，炉子调压器最大进口 0.5 psi，中间必须装什么？",
 a:["A line pressure regulator","A second appliance regulator","A service regulator","An overpressure relief valve only"],
 e:"必须装 line pressure regulator（或工业调压器）把 2 psi 降到 0.5 psi 以下。老师给的条款：B149.1 cl. 5.2.1.2；理由是 cl. 5.2.1.1，供气压力必须在铭牌范围内。service regulator 是燃气公司在表前装的，不是这个用途。",
 p:"90", qt:"The use of a line pressure regulator is generally for reducing the building-line pressure accordingly. For example, a 2-psig service needs to be reduced to a maximum of 0.5 psig as that is the maximum inlet pressure to most appliance regulators.", src:"both"},

{s:1, q:"What is the maximum inlet pressure for most appliance regulators?",
 zh:"大多数器具调压器的最大进口压力是多少？",
 a:["0.5 psig","2 psig","5 psig","7 inches w.c."],
 e:"大多数器具调压器最大进口是 0.5 psig（约 14 in w.c.）。7 in w.c. 是天然气常见的进口工作压力，不是上限。",
 p:"90", qt:"...a 2-psig service needs to be reduced to a maximum of 0.5 psig as that is the maximum inlet pressure to most appliance regulators.", src:"both"},

{s:1, q:"The line pressure regulator feeding an appliance must be of which type (B149.1 cl. 5.2.1.6)?",
 zh:"给器具供气的 line pressure regulator 必须是哪种类型？",
 a:["Lock-up (positive shut-off) type","Vent-limiting type only","Adjustable bypass type","Pilot-loaded relief type"],
 e:"老师强调：调压器必须是 lock-up（positive shut-off）型，cl. 5.2.1.6。这一条在 Unit 13 教材里没有展开，属于 Unit 11 和规范内容。",
 p:"", qt:"", src:"class", flag:"条款号来自课堂录音，考前用 Code Compass 或 B149.1 核对。"},

{s:1, q:"What does 'lock-up type' mean for a gas pressure regulator?",
 zh:"调压器的 lock-up 是什么意思？",
 a:["It holds the reduced outlet pressure when no gas is flowing, with no creep","It vents gas to atmosphere whenever outlet pressure rises","It opens fully when inlet pressure drops","It bypasses gas around the diaphragm at high demand"],
 e:"Lock-up：没有用气时，出口压力被锁在设定值，不会慢慢爬升（no creep）。这样下游阀门的膜片不会被高压冲坏。",
 p:"", qt:"", src:"class"},

{s:1, tf:true, q:"A pressure regulator may be bypassed temporarily if the appliance is short of gas pressure.",
 zh:"燃气压力不够时，可以临时把调压器旁通。",
 a:["True","False"], c:1,
 e:"错。B149.1 cl. 5.2.1.5：pressure regulator shall not be bypassed，任何情况都不行。",
 p:"", qt:"", src:"class"},

{s:1, q:"Where does the Code require the readily accessible manual gas shut-off valve for each appliance?",
 zh:"规范要求每台器具的手动关断阀装在哪里？",
 a:["Upstream and external to the valve train assembly","Inside the combination gas valve","Downstream of the appliance regulator","At the gas meter only"],
 e:"每台器具都要有一个容易够到的手动关断阀，装在阀组上游、阀组外面。阀组内部另有 A-cock 和 B-cock，分别控制主燃烧器和长明火。",
 p:"84", qt:"The Code clearly requires that a readily accessible gas shut-off valve for each appliance be installed upstream and external to the valve train assembly.", src:"book"},

{s:1, q:"In a diaphragm or servo gas valve, what provides the main force that lifts the diaphragm open?",
 zh:"膜片阀/伺服阀里，真正把膜片顶开的主要力量是什么？",
 a:["Upstream (inlet) gas pressure","The coil pulling the seat directly","The return spring","Thermocouple millivolts"],
 e:"线圈只是移动一个很小的先导机构，真正顶开膜片的是进口燃气压力。所以线圈好、电压好、进口压力低，阀照样不开。这也是为什么膜片阀可以用很低的电压（甚至毫伏）驱动。",
 p:"95", qt:"The diaphragm gas valve is a pilot operated solenoid valve in that it uses available gas pressure as the primary force to open or close the valve.", src:"both"},

{s:1, q:"You measure 24 V at the gas valve but there is no gas at the burner. What should you do before condemning the valve?",
 zh:"燃气阀上有 24 V，但燃烧器没气。判阀坏之前先做什么？",
 a:["Put a manometer on the inlet pressure tap","Replace the transformer","Jumper out the high limit","Replace the ignition module"],
 e:"老师的 trade tip：24 V at the valve 不等于 gas at the burner。先在进口测压点接压力计，最好在满负荷、其他燃气设备都开着时测。老师举例：换了阀还是不行，原因是燃气公司因欠费把表关了。",
 p:"", qt:"", src:"class"},

{s:1, q:"Natural gas furnace: inlet pressure reads about 7 in w.c., but outlet (manifold) pressure reads 1.6 in w.c. What does this tell you?",
 zh:"天然气炉进口 7 in w.c.，出口只有 1.6 in w.c.，说明什么？",
 a:["There is a problem at the valve, such as a restriction or a failing valve","The appliance is operating normally","The appliance is converted to propane","The inlet pressure is too high"],
 e:"进口正常、出口偏低，问题在阀本身或阀内：干掉的管道密封胶、杂物堵塞，或阀/线圈在老化。老师说出口应在 3.5 in w.c. 左右；教材写天然气约 3 in w.c.、丙烷约 10 in w.c.，以铭牌为准。所以进出口都要测。",
 p:"90", qt:"Appliance regulators are necessary to reduce the building-line pressure to that required for the proper performance of the appliances (e.g., approximately 3 inches w.c. for natural gas and 10-inches w.c. for propane gas).", src:"both"},

{s:1, q:"What does the Canadian Code Compass app give you when you type in a problem?",
 zh:"Code Compass 这个工具输入问题后会给你什么？",
 a:["A clause number and a plain-language summary; you still read the actual Code wording","The official Code text, so the book is not needed","A pass/fail inspection result","Manufacturer installation instructions"],
 e:"老师介绍的本周工具：输入问题，返回条款号和白话总结，可按 B149.1（天然气）/ B149.2（丙烷）筛选，离线可用。它只是帮你找条款，被开罚单看的是规范原文。",
 p:"", qt:"", src:"class"},

/* ---------- 2 ---------- */
{s:2, q:"Which electrical drawing is considered a map of an electrical circuit, showing where the wires go?",
 zh:"哪种电气图被看作电路的“地图”，显示线接在哪？",
 a:["Wiring diagram","Schematic diagram","Ladder diagram","Block diagram"],
 e:"Wiring diagram 是地图，告诉你每根线接到哪里，适合接线和查线；但看不出系统怎么工作。",
 p:"115", qt:"Wiring diagrams are maps of electrical circuits. They are very useful for initially wiring a circuit and for tracing wires when you are troubleshooting.", src:"both"},

{s:2, q:"Which drawing is best used to determine how current flows through the various parts of a circuit?",
 zh:"想知道电流怎么流过电路各部分，最好看哪种图？",
 a:["Schematic diagram","Wiring diagram","Pictorial diagram","Block diagram"],
 e:"Schematic 显示两件事：电源，以及电流怎么流过触点、线圈等。排查故障要用它。",
 p:"116", qt:"The schematic diagram shows basically two things: the power source; and how current flows through the various parts of the circuit such as contacts, coils, and overloads.", src:"both"},

{s:2, q:"A schematic diagram is also known as a:",
 zh:"Schematic diagram 的另一个名字是？",
 a:["Ladder diagram","Connection diagram","Component layout","P&C drawing"],
 e:"Schematic 也叫 ladder diagram（梯形图），左右两根“立柱”，中间一根根“横档”就是各条回路。",
 p:"116", qt:"This schematic is also called a ladder diagram.", src:"both"},

{s:2, tf:true, q:"The left-hand side of the ladder diagram represents the incoming voltage.",
 zh:"梯形图左边代表进线电压。",
 a:["True","False"], c:0,
 e:"对。左边 = 进线电压（hot），开关都画在左边；右边 = 流出电流（neutral），负载靠右。",
 p:"116", qt:"Left-hand side of the ladder: Represents the incoming voltage. Right-hand side of the ladder: Represents the outgoing current.", src:"both"},

{s:2, q:"Why are switches placed on the hot (left) side of a circuit rather than on the neutral side?",
 zh:"为什么开关要装在火线一侧，不装在零线一侧？",
 a:["When the switch opens, the load has no power and is safe to service","It reduces voltage drop across the load","It is required for motor rotation direction","It uses less wire"],
 e:"开关在零线上，断开后负载停了，但负载仍然连着火线，拆的时候会触电。开关在火线上，断开后负载没电，可以安全拆装。",
 p:"129", qt:"Switches connected to loads are normally located on the hot line — never in the neutral line.", src:"both"},

{s:2, q:"Which statement about series and parallel circuits is correct?",
 zh:"关于串联和并联，哪句是对的？",
 a:["A parallel circuit has more than one path for current flow","A series circuit has more than one path for current flow","In a parallel circuit, current must pass through each component in sequence","Several motors in series each receive full line voltage"],
 e:"串联只有一条路径，电流依次流过每个元件，电压被分掉；并联有多条路径，每条支路电压相同。所以多个电机要并联，串联的话后面的电机电压不够。",
 p:"117", qt:"Series circuits: The components are connected in such a way that the electric current must pass through each one in sequence. Parallel circuits: More than one path is available for current flow.", src:"both"},

{s:2, q:"On a wiring diagram, two wires cross and there is NO dot at the crossing. What does this mean?",
 zh:"接线图上两根线交叉，交叉处没有点，表示什么？",
 a:["The wires cross but are not electrically connected","The wires are connected","The wires are field wiring","One wire is a ground"],
 e:"有点 = 相连；没点 = 只是交叉，不相连。",
 p:"116", qt:"When the wires cross, a dot means that the two wires are connected. If a dot is not shown, the wires cross each other but do not connect electrically.", src:"book"},

{s:2, q:"On a commercial unit drawing, the disconnect symbol shows three poles switched together. Why?",
 zh:"商用设备图上隔离开关画成三极联动，为什么？",
 a:["The unit has a three-phase supply, so three lines are switched at once","There are three fuses in series","There are three separate 24 V control circuits","It is a time-delay disconnect"],
 e:"老师讲：单相只控制一根火线就画一极；两根火线画两极；三相大设备三根线一起断，就画三极。图上极数不同不要慌，看进来几根火线。",
 p:"118", qt:"", src:"class"},

{s:2, q:"In what position are all switch symbols shown on a diagram?",
 zh:"图上所有开关符号画的是什么状态？",
 a:["The resting position (medium has not acted on it)","The energized position","The closed position","Whatever position the installer chooses"],
 e:"开关一律画在“静止”状态，即温度、压力等介质还没让它动作的状态。所以继电器通电后，NO 变闭合、NC 变断开。",
 p:"118", qt:"All switch symbols in a wiring diagram are shown in the “resting” position. Resting means that the medium (heat, pressure, etc.) has not caused the switch to change positions.", src:"both"},

{s:2, q:"A normally open switch symbol is drawn BELOW the line. When will it close?",
 zh:"常开开关符号画在线的下方，它在什么时候闭合？",
 a:["On an increase in the activating medium","On a decrease in the activating medium","Only when manually reset","It never changes state"],
 e:"教材表格：NO 符号画在线下方 → 介质（热、压力等）增加时闭合；画在线上方 → 介质减少时闭合。老师说“怎么画的很重要”，看开关刀片会往哪边倒。",
 p:"119", qt:"If the NO switch symbol is shown below the line: The switch will close on an increase in the activating medium.", src:"both"},

{s:2, q:"A normally open switch symbol is drawn ABOVE the line. When will it close?",
 zh:"常开开关符号画在线的上方，它在什么时候闭合？",
 a:["On a decrease in the activating medium","On an increase in the activating medium","Only when energized by a relay","On a short to ground"],
 e:"画在线上方的 NO 开关，介质减少时闭合。和上一题对照记。",
 p:"119", qt:"If the NO switch symbol is shown above the line: The switch will close on a decrease in the activating medium (heat, pressure, etc.).", src:"book"},

{s:2, q:"Limit switches are typically in which position?",
 zh:"限位（limit）开关一般是什么状态？",
 a:["Normally closed (NC)","Normally open (NO)","SPDT with no common","Always open until reset"],
 e:"Limit 开关一般是 NC，出现不安全状况时断开；动作类开关（actuating）一般是 NO。",
 p:"119", qt:"Switches are designated normally closed (NC) when the resting position of the switch is closed. Typically, limit switches are in the NC position.", src:"both"},

{s:2, q:"An SPDT switch is to be wired in the normally open position. Which terminals are used?",
 zh:"SPDT 开关接成常开，用哪两个端子？",
 a:["The NO terminal and the common terminal","The NC terminal and the common terminal","The NO and NC terminals","All three terminals"],
 e:"SPDT 有三个端子，一般只用两个：接成 NO 用 NO + C；接成 NC 用 NC + C。燃气阀在控制板上就是接 NO + common。",
 p:"119", qt:"If wired in NO position, the wire will be connected to the NO terminal and the common terminal.", src:"both"},

{s:2, q:"On the furnace door diagram (Figure 2-19), what is the drawing on the left that reads top to bottom like a ladder?",
 zh:"炉门内侧的图（Figure 2-19），左边那张像梯子一样从上到下的是什么？",
 a:["The schematic (ladder) diagram, laid out to follow the sequence of operation","The wiring diagram","A pictorial diagram","The factory test record"],
 e:"打开面板看到的是两张图，不是一张：左边是 schematic（梯形图），用来跟踪动作顺序；右边是 wiring diagram，显示线怎么接。",
 p:"129", qt:"The wiring diagram on the right shows the electrical connections between the switches and loads. The schematic diagram (ladder diagram) on the left is laid out in order to follow the electrical sequence of operation.", src:"both"},

{s:2, q:"How is field wiring identified on a wiring schematic?",
 zh:"接线图上现场接线（field wiring）怎么表示？",
 a:["Dotted (dashed) lines","Solid bold lines","Highlighted lines","Red lines"],
 e:"虚线 = 现场接线，比如接到别的房间的温控器线，可能有几十英尺长。IFC 上唯一需要现场接的通常就是温控器线。",
 p:"69", qt:"The field wiring is always identified on wiring schematics with dotted lines.", src:"both"},

/* ---------- 3 ---------- */
{s:3, q:"What are the most common auxiliary devices found in control systems?",
 zh:"控制系统里最常见的辅助装置是什么？",
 a:["Switches","Relays","Contactors","Protective devices"],
 e:"辅助装置包括开关、继电器、接触器和保护装置，其中最常见的是开关。",
 p:"118", qt:"Auxiliary devices include switches, relays, contactors, and protective devices. Switches are the most common auxiliary device found in control systems; they are used to start or stop a system.", src:"both"},

{s:3, q:"It is common for a relay coil to be powered by 24 V while its contacts close a 120 V circuit. What is the advantage?",
 zh:"继电器线圈用 24 V、触点控制 120 V，好处是什么？",
 a:["The control circuit can operate on safer, lower voltage wiring","The relay contacts never wear out","No transformer is needed","The load draws less current"],
 e:"控制回路用低压，更安全。但继电器线圈电压有很多种，换件时要核对线圈电压。",
 p:"120", qt:"It is quite common for relays to be powered by 24 V, but they close a 120 V circuit. This way, the control circuit can operate on safer lower voltage wiring.", src:"both"},

{s:3, q:"On a relay rating chart, what does AFL stand for?",
 zh:"继电器额定值表上的 AFL 是什么意思？",
 a:["Amps full load","Amps fault limit","Allowable field load","Amps for lock rotor"],
 e:"AFL = Amps Full Load，触点能反复接通和断开而不过热、不打火的满载电流。ALR 才是锁转电流（Amps Locked Rotor）。",
 p:"121", qt:"For example, the NO contacts when connected to a 120 VAC circuit are rated for: 1 horsepower (HP); 16 Amps full load (AFL); 96 Amps lock rotor (ALR); and 16 Ohms contact resistance (RES).", src:"both"},

{s:3, q:"Using the relay chart (NO 120 V: 16-96; NO 240 V: 8-48; NC 120 V: 13.8-82.8; NC 240 V: 8.9-41.4), what is the AFL rating of the normally closed contacts on a 120 V circuit?",
 zh:"按继电器额定值表，120 V 回路上常闭触点的 AFL 是多少？",
 a:["13.8 A","8.9 A","16 A","82.8 A"],
 e:"找 NC 行、120 V 那一格，AFL-ALR 写的是 13.8-82.8，前面的 13.8 是 AFL，后面的 82.8 是 ALR。这是 Chapter 2 作业第 6 题的原型。",
 p:"135", qt:"NC 120 | 3/4 | 13.8-82.8 | 14", src:"both"},

{s:3, q:"Using the same relay chart, what is the AFL rating of the normally open contacts on a 240 V circuit?",
 zh:"同一张表，240 V 回路上常开触点的 AFL 是多少？",
 a:["8 A","16 A","48 A","8.9 A"],
 e:"NO 行、240 V：8-48，AFL 是 8 A。8.9 A 是 NC 在 240 V 的值，别看串行。",
 p:"122", qt:"NO 240 | 1 | 8-48 | 8", src:"both"},

{s:3, q:"What are heavy-duty contactors used for?",
 zh:"重型接触器用来做什么？",
 a:["Switching large currents and high voltages, such as a three-phase motor","Sensing flame current","Providing a time delay for the blower","Reducing 120 V to 24 V"],
 e:"接触器就是大号继电器，用电磁铁带动横杆同时闭合几组触点，控制大电流、高电压设备，比如大锅炉上的三相电机。",
 p:"123", qt:"Heavy duty contactors are solenoid/armature operators for switching heavy-duty electrical contacts. They are used to control the large amounts of current and high voltages required by industrial equipment.", src:"book"},

{s:3, tf:true, q:"Integrated electronic control boards have replaced most time-delay relays.",
 zh:"集成电子控制板已经取代了大多数延时继电器。",
 a:["True","False"], c:0,
 e:"对。现在的新设备大多用集成控制板，里面已经包含所有需要的延时功能。",
 p:"123", qt:"Most of the new equipment manufactured today have integrated control boards that include all the time-delay functions needed to operate the equipment.", src:"book"},

{s:3, q:"For AC circuits, the differentiation between the hot, neutral and ground wires is described as:",
 zh:"交流电路中，区分火线、零线和地线叫什么？",
 a:["Polarization (polarity)","Phasing","Sequencing","Modulation"],
 e:"直流电路里 polarity 指电流方向；交流电路里指区分 hot、neutral、ground。Phasing 是另一个概念，指变压器一次侧和二次侧极性匹配。",
 p:"124", qt:"In a DC circuit, polarity refers to the direction of current flow. In an AC circuit, polarity refers to the differentiation between hot, neutral, and ground.", src:"both"},

{s:3, q:"Your meter reads 120 V between L1 and N at the junction box. What does this tell you about polarity?",
 zh:"接线盒里 L1 和 N 之间测到 120 V，这能说明极性对吗？",
 a:["Nothing yet; you must test each wire to ground","Polarity is correct","Polarity is reversed","The neutral is open"],
 e:"火零接反也一样测到 120 V。第一步只说明两线间有电压，第二步要每根线分别对地测。",
 p:"125", qt:"If there is a voltage potential, connect the meter from each wire to ground, as shown in Figure 2-13, to determine which is hot (120 VAC reading) and which is neutral (0 VAC reading).", src:"both"},

{s:3, q:"How do you identify the hot lead with a voltmeter?",
 zh:"用电压表怎么找火线？",
 a:["The lead that reads 120 VAC to ground is hot","The lead that reads 0 VAC to ground is hot","The white wire is always hot","Measure resistance between the two leads"],
 e:"对地 120 V 的是火线（通常黑色）；对地 0 V 的是零线。",
 p:"126", qt:"The lead which shows a 120 VAC reading to ground is the hot wire and is usually black.", src:"both"},

{s:3, q:"Why should neutral-to-ground read 0 V on a correctly wired circuit?",
 zh:"接线正确时，零线对地为什么是 0 V？",
 a:["Neutral and ground are bonded together at the panel","The neutral carries no current","The ground wire has a fuse","The transformer isolates them"],
 e:"老师讲：配电盘里零线排和地线排都固定在金属箱上，两者在盘里是连通的，所以零对地应该是 0。如果不是 0，说明某处零线接错了。",
 p:"125", qt:"Ground wire: Is connected to ground and only carries current when there is a short to ground in the circuit.", src:"both"},

{s:3, q:"After you open the appliance disconnect switch, what should the hot lead read to ground?",
 zh:"断开器具隔离开关后，火线对地应该读多少？",
 a:["0 VAC","120 VAC","24 VAC","96 VAC"],
 e:"确认隔离开关确实切断了火线：断开后火线对地应为 0 VAC。",
 p:"126", qt:"After you have disconnected it (turned it to the off position), you must check the hot lead to ground. There should now be a 0 VAC reading.", src:"book"},

{s:3, q:"On line voltage circuits, where should switches be placed?",
 zh:"线电压回路中，开关应该放在哪？",
 a:["In series, before the load","In parallel with the load","After the load, on the neutral","Between neutral and ground"],
 e:"开关与负载串联，并且在负载之前（火线侧）。并联的话根本关不掉负载。",
 p:"126", qt:"Note: On line voltage circuits, the switches should be placed in series before the load.", src:"both"},

{s:3, q:"What is matching the polarity of the primary and secondary sides of a transformer called?",
 zh:"让变压器一次侧和二次侧极性一致，叫什么？",
 a:["Phasing","Polarization","Sequencing","Modulating"],
 e:"Phasing（相位匹配）。注意这里不是在说单相/三相电机，而是 120 V 一次侧和 24 V 二次侧是否同相。",
 p:"115", qt:"Phasing: Matching the polarity of the primary and secondary sides of a transformer.", src:"both"},

{s:3, tf:true, q:"Primary and secondary sine waves that peak on opposite sides of the zero line are in phase.",
 zh:"一次侧和二次侧的正弦波在零线两侧相反时，它们是同相的。",
 a:["True","False"], c:1,
 e:"错，这是不同相（out of phase）。同相是两条波同时到达波峰、同时到达波谷。",
 p:"127", qt:"Where the primary and secondary are not in phase, the sine wave will appear as shown in Figure 2-16. The difference in the potential between the primary and secondary is now 144 V.", src:"both"},

{s:3, q:"When checking transformer phasing between the 120 VAC hot and the ungrounded side of the secondary, what reading means they are in phase?",
 zh:"检查变压器相位，120 V 火线到二次侧未接地端，读数多少表示同相？",
 a:["96 VAC","144 VAC","24 VAC","120 VAC"],
 e:"同相：120 − 24 = 96 V。不同相：120 + 24 = 144 V。这一题老师让大家划重点。",
 p:"128", qt:"Check the voltage between the hot and the ungrounded side of the secondary. If the primary and secondary are in phase, the reading should be 96 V.", src:"both"},

{s:3, q:"You read 144 V when checking transformer phasing. What should you do?",
 zh:"测相位读到 144 V，应该怎么处理？",
 a:["Move the ground to the other secondary terminal (or swap the primary leads) and recheck for 96 V","Replace the transformer","Nothing, 144 V is normal","Reverse the thermostat wires"],
 e:"144 V 说明不同相。把接地移到二次侧另一个端子，再测应为 96 V；如果二次侧已标好 R 和 C，就对调一次侧的接线。",
 p:"128", qt:"If the reading is 144 V, the primary and secondary are not in phase move the ground to the other terminal of the secondary and now the reading between L1 and the ungrounded side of the secondary will read 96 V.", src:"both"},

{s:3, q:"Why does polarity matter on many newer electronic control boards?",
 zh:"为什么很多新式电子控制板对极性有要求？",
 a:["Boards using flame rectification will not work properly, or at all, with incorrect polarity","Reversed polarity makes the inducer run backwards","It changes the thermostat anticipator setting","It doubles the gas valve voltage"],
 e:"带火焰整流（flame rectification）的控制板，极性不对就工作不正常甚至完全不工作。有些板还要求降压变压器相位正确。",
 p:"124", qt:"Some of the electronics boards being used today, with flame rectification, will not function properly — or at all — unless the polarization is correct.", src:"both"},

/* ---------- 4 ---------- */
{s:4, q:"In the furnace sequence (Figure 2-19), what must be closed for the 120/24 V transformer to be powered?",
 zh:"炉子时序里，什么闭合后 120/24 V 变压器才通电？",
 a:["The door switch and the limit switch","The thermostat and the air proving switch","The rollout switch and vent switch","The fan switch"],
 e:"时序第 1 步：门开关和限温开关都闭合，变压器通电。",
 p:"130", qt:"With the door switch and the limit switch in the closed position, the 120/24 V transformer is powered.", src:"both"},

{s:4, q:"When the thermostat calls for heat in Figure 2-19, what does it power first?",
 zh:"温控器要热后，首先给什么供电？",
 a:["The furnace relay coil, whose contacts then start the inducer","The gas valve directly","The circulating blower","The igniter"],
 e:"温控器闭合 → 炉子继电器线圈得电 → 继电器触点闭合 → 引风机（inducer）启动。",
 p:"130", qt:"This powers the furnace relay coil, which in turn closes the furnace relay contacts. These contacts then power the induced blower motor.", src:"both"},

{s:4, q:"What follows the inducer starting in the furnace sequence?",
 zh:"引风机启动后，下一步是什么？",
 a:["The air proving switch closes and powers the control module","The igniter energizes immediately","The circulating blower starts","The main valve opens"],
 e:"引风机建立压力 → 风压开关闭合 → 电经过常闭的 rollout 和 vent 开关，给控制模块供电。",
 p:"130", qt:"The running of the induced blower will cause the air proving switch to close. This powers the control module as the flame rollout switch and vent switch are normally closed.", src:"both"},

{s:4, q:"The flame rollout switch and vent safety switch in Figure 2-19 are:",
 zh:"图中的 rollout 开关和排烟安全开关是什么状态？",
 a:["Normally closed safeties wired in series with the control module","Normally open switches that close on a call for heat","Wired in parallel with the thermostat","Field-adjustable operating controls"],
 e:"两者都是安全开关，常闭，与控制模块串联。出现不安全状况时断开，模块就没电。",
 p:"130", qt:"Control circuit — 24 V: Thermostat (NO), Flame rollout switch (NC), Vent safety switch (NC), Air proving switch (NO).", src:"both"},

{s:4, q:"What is the purpose of the control module's safe start check?",
 zh:"控制模块 safe start check 的目的？",
 a:["To confirm there is not already an existing flame","To confirm the pilot flame","To confirm the induced fan is running","To confirm the main flame"],
 e:"点火前确认没有已经存在的火焰（或假火焰信号）。模块不连接引风机和风压开关，它只能检查火焰信号。",
 p:"130", qt:"The control module performs safe start check to confirm there is not already an existing flame.", src:"both"},

{s:4, q:"After a successful safe start check, which two things are powered at the same time?",
 zh:"Safe start 通过后，哪两样同时通电？",
 a:["The igniter and the pilot valve","The main valve and the blower","The inducer and the igniter","The pilot valve and the main valve"],
 e:"点火器和长明火阀同时通电，然后通过火焰传感器证实长明火。",
 p:"130", qt:"If safe start is indicated, the igniter and pilot valve are powered simultaneously. The pilot is proven through the flame sensor.", src:"both"},

{s:4, q:"Once the pilot is proven, what happens next?",
 zh:"长明火被证实后，接下来发生什么？",
 a:["The main valve is powered and the igniter is de-energized","The igniter stays on for the whole cycle","The blower starts immediately","The module goes into lockout"],
 e:"长明火证实 → 主阀通电 → 点火器断电 → 主燃烧器点燃。",
 p:"130", qt:"If the pilot is proven, the main valve is powered, and the igniter is de-energized.", src:"both"},

{s:4, q:"In a fan and limit furnace, what starts the circulating blower?",
 zh:"带 fan/limit 控制的炉子，循环风机什么时候启动？",
 a:["The fan control switch closes when temperature rises to its setpoint","The thermostat closes","The air proving switch closes","The pilot is proven"],
 e:"炉内温度升到风机控制设定点，风机开关闭合，循环风机启动。",
 p:"130", qt:"As the temperature rises to the fan control setpoint, the fan control switch will close, energizing the circulating blower motor (fan).", src:"both"},

{s:4, q:"After the thermostat is satisfied, when does the circulating blower stop on a fan and limit furnace?",
 zh:"温控器满足后，fan/limit 炉的循环风机什么时候停？",
 a:["When the temperature drops below the fan control setpoint differential","Immediately when the burner stops","After exactly 3 minutes","When the limit switch opens"],
 e:"燃烧器停后风机继续吹，直到温度降到风机开关设定点以下（双金属片冷却）。现在的数字控制板改用定时器倒计时。",
 p:"130", qt:"The circulating blower motor will continue to operate after the thermostat opens until the temperature drops below the fan control switch setpoint differential.", src:"both"},

{s:4, q:"A control module has terminals marked PV, MV, igniter-sensor and 25V. What type of system is it?",
 zh:"控制模块上有 PV、MV、点火感应端子和 25V，这是什么系统？",
 a:["Intermittent pilot","Direct spark ignition","Hot surface ignition","Standing pilot with thermocouple"],
 e:"有 PV（pilot valve）就有长明火，是间歇长明火（intermittent pilot）。直接火花点火（DSI）没有长明火端子，只有 MV。标 25V 说明是火花点火类。",
 p:"64", qt:"Energizes the pilot valve through terminal marked “PV”... Energizes the main gas valve through the terminal marked “MV”.", src:"both"},

{s:4, q:"How does a direct spark ignition module differ from an intermittent pilot module?",
 zh:"直接火花点火模块和间歇长明火模块有什么区别？",
 a:["It has no pilot valve terminals; the spark lights the main burner directly","It needs line voltage for the igniter","It has no flame sensor","It never goes into lockout"],
 e:"DSI 没有长明火，火花直接点主燃烧器，所以没有 PV 端子；如果用 redundant 阀，两个线圈并联一起通电。",
 p:"65", qt:"Direct spark ignition does not use a pilot flame but rather directly lights the main burner with a spark. The control module, therefore, does not have the terminals for pilot valves.", src:"book"},

{s:4, q:"Why is a hot surface igniter connected to the line voltage supply?",
 zh:"热表面点火器（HSI）为什么接线电压？",
 a:["It needs line voltage to heat the surface hot enough to ignite the gas","It uses line voltage to sense flame","Code requires all igniters on 120 V","It replaces the transformer"],
 e:"HSI 要靠线电压把表面烧到足以点燃燃气（约预热 30 秒），所以模块上有 L1、L2 和 HSI 端子。",
 p:"67", qt:"The hot surface igniter requires line voltage to heat the surface hot enough to ignite gas on contact. It is therefore directly connected to the line voltage supply.", src:"book"},

{s:4, q:"Which describes the operation of a flame rollout switch?",
 zh:"火焰回卷开关（rollout switch）怎么工作？",
 a:["A normally closed switch that opens on flame rollout","A normally open switch that closes on flame rollout","A normally open switch that closes when the inducer runs","A normally closed switch that closes when the inducer stops"],
 e:"常闭，火焰回卷时断开。多数是带手动复位按钮的 snap disc 开关。",
 p:"50", qt:"The snap disc type of high-limit switch is often used as a flame roll-out switch for various applications. It also includes a small manual reset button between the electrical connections.", src:"both"},

{s:4, q:"What is the difference between an integrated furnace control (IFC) and an ignition control module?",
 zh:"IFC 和点火控制模块（ICM）有什么区别？",
 a:["An IFC manages the entire furnace (ignition, inducer, blower, staging); an ICM handles ignition and flame monitoring","An ICM controls the blower; an IFC does not","They are the same device","An IFC has no flame sensing"],
 e:"IFC 管整台炉子：点火、引风机、风机、两段火、空气净化器、加湿器等。非集成的点火模块只管安全点火和监视火焰。",
 p:"131", qt:"An integrated furnace control (IFC) manages the entire operation of a furnace, besides the ignition control, this can include two-stage burner operation, variable fan speed, electronic air cleaner, and humidifier depending on the furnace model.", src:"both"},

{s:4, tf:true, q:"You can determine the sequence of operation for all components connected to an IFC from the wiring diagram.",
 zh:"从接线图可以看出 IFC 上所有部件的动作顺序。",
 a:["True","False"], c:1,
 e:"错。接线图看不出模块内部的顺序，要看厂家的操作说明（有的给时序图）。",
 p:"131", qt:"Just as you could not determine the sequence of events for the ignition control module from the previous wiring diagram, you now cannot determine the sequence for any load shown connected to the IFC.", src:"both"},

{s:4, q:"Where do you get the internal sequence of operation of an ignition module or IFC?",
 zh:"点火模块或 IFC 的内部时序从哪里查？",
 a:["The manufacturer's operating instructions","The wiring diagram","The appliance rating plate","The CSA B149.1 Code"],
 e:"从厂家资料查，有的厂家会给图形化时序表（如 Figure 2-21）。",
 p:"132", qt:"The sequence of operation needs to be determined from the operating instructions.", src:"both"},

{s:4, q:"When replacing an IFC, what must you make sure matches the original?",
 zh:"更换 IFC 时，什么必须和原来一致？",
 a:["The DIP switch configuration (or manufacturer's specifications)","The colour of the board","The fuse brand","The transformer VA rating"],
 e:"拆之前先看原板的 DIP 开关设置，新板设成一样或按厂家要求设。",
 p:"133", qt:"If you replace an IFC, make sure to match the DIP switch configuration to the original IFC and/or manufacturer's specifications.", src:"both"},

{s:4, q:"Which of these is NOT normally adjusted with an IFC's DIP switches?",
 zh:"下面哪项一般不是用 IFC 的 DIP 开关调的？",
 a:["Manifold gas pressure","Heat off delay","Trial for ignition time","Cool off delay"],
 e:"DIP 开关可以调：heat off delay、trial for ignition、heat on delay、stage delay、cool off delay。歧管压力是在燃气阀的调压螺丝上调。",
 p:"133", qt:"The IFC will have DIP switches that can be used to change some of the operating parameters such as heat off delay, trial for ignition, heat on delay, stage delay (for single-stage thermostat), and cool off delay.", src:"both"},

{s:4, q:"DIP table (heat off delay): SW2 ON + SW3 ON = 100 s, SW2 OFF + SW3 ON = 140 s, SW2 ON + SW3 OFF = 60 s, SW2 OFF + SW3 OFF = 180 s. The board shows SW2 OFF and SW3 OFF. What is the heat off delay?",
 zh:"按 DIP 表，SW2 和 SW3 都是 OFF，heat off delay 是多少？",
 a:["180 s","60 s","100 s","0 s"],
 e:"SW2、SW3 都 OFF = 180 秒：燃烧器停后风机还要吹 3 分钟。老师说这有点长，一般 60 到 90 秒。注意先确认题目给的表，各厂家组合不同。",
 p:"137", qt:"Use the DIP table shown here to interpret the HEAT “OFF” DELAY setting for the DIP switch configuration shown.", src:"both"},

{s:4, q:"On the same board, SW1 (cool off delay) is ON = 0 s. What happens when cooling stops?",
 zh:"同一块板，SW1 为 ON（制冷关闭延时 0 秒），制冷停止时会怎样？",
 a:["The blower shuts off immediately","The blower runs 180 s longer","The blower runs continuously","The inducer runs 60 s longer"],
 e:"同一张表的左半边：SW1 ON = 0 秒（出厂设置），SW1 OFF = 80 秒。0 秒就是制冷一停风机马上停。",
 p:"137", qt:"COOL “OFF” DELAY: SW1 ON = 0 SEC (factory setting); SW1 OFF = 80 SEC", src:"both"},

{s:4, q:"On a typical IFC fault code chart, what does 4 flashes usually mean?",
 zh:"常见 IFC 故障码表中，闪 4 下一般表示什么？",
 a:["Open temperature limit circuit","Draft pressure error","Flame sensed when no flame should be present","Gas valve circuit error"],
 e:"教材 Figure 1-65：2 闪系统锁定、3 闪排烟压力故障、4 闪限温回路断开、5 闪不该有火时检测到火焰、6 闪电源反接/接地差/电压低。老师提醒：各厂家不同，考试应该会给表。",
 p:"71", qt:"4 flashes: Open temperature limit circuit", src:"both", flag:"闪码因厂家而异，以题目给的表为准。"},

{s:4, q:"On the same IFC fault code chart, what does 3 flashes mean?",
 zh:"同一张故障码表，闪 3 下表示什么？",
 a:["Draft pressure error (venting, pressure switch or inducer problem)","Open temperature limit circuit","System lockout","Low flame sense signal"],
 e:"3 闪：排烟压力故障，可能是排烟问题、压力开关问题或引风机问题。",
 p:"71", qt:"3 flashes: Draft pressure error — possible problems: a) Venting problem b) Pressure switch problem c) Inducer problem", src:"both"},

{s:4, q:"On the IFC fault code chart, what does 6 flashes mean?",
 zh:"IFC 故障码 6 闪表示什么？",
 a:["115 VAC power reversed, poor grounding, or system voltage too low","Gas valve circuit error","Open temperature limit circuit","Normal call for heat"],
 e:"6 闪：115 V 电源反接、接地不良或电压太低。老师课上也回忆起是 reverse polarity。",
 p:"71", qt:"6 flashes: 115 Volt AC power reversed, poor grounding, or system voltage too low", src:"both"},

{s:4, q:"A control module is in lockout. What is needed to restart it?",
 zh:"控制模块锁定（lockout）后怎么重启？",
 a:["A manual reset: reset button, or turn the thermostat down, wait, then back up","It restarts on its own after the next call for heat","Replace the module","Jumper the flame sensor"],
 e:"Lockout 是点火试火时间用完后的状态，要手动复位：按模块复位钮，或把温控器调到最低让模块断电，等 1 到 3 分钟再调回来。",
 p:"62", qt:"The module then requires a manual reset to restart the ignition sequence, accomplished either by depressing a reset button on the control module or by turning the thermostat to its lowest setting.", src:"both"},

/* ---------- 5 ---------- */
{s:5, q:"Thermostats, operating aquastats and operating pressuretrols belong to which section of the control system?",
 zh:"温控器、运行水温控制器、运行压力控制器属于控制系统的哪一部分？",
 a:["Operating controllers","Limit and safety controllers","Combustion safety controller","Ignition control module"],
 e:"控制系统四部分：operating controllers、limit and safety controllers、combustion safety controller、ignition control module。这三个都是 operating controllers。",
 p:"22", qt:"Operating controllers: Respond to changes in the controlled variable (temperature, pressure, etc.) and make or break a circuit. Examples: thermostats, operating aquastats, and operating pressure controls.", src:"both"},

{s:5, q:"Low-water cut-offs, high-limit aquastats and flow switches belong to which section of the control system?",
 zh:"低水位切断、高限水温控制、流量开关属于哪一部分？",
 a:["Limit and safety controllers","Operating controllers","Combustion safety controller","Ignition control module"],
 e:"它们在继续运行会不安全时，从运行控制器手里“收回指挥权”。",
 p:"22", qt:"Limit and safety controllers: Take the command away from the operating controls when continued operation would cause an unsafe situation.", src:"both"},

{s:5, q:"A thermostat may be rated for direct switching of three kinds of loads. Which is NOT one of them?",
 zh:"温控器可以直接切换三种负载，下面哪个不是？",
 a:["480 V three-phase","Line voltage (120 V)","Low voltage (24 V)","Millivolt"],
 e:"三种：线电压（120 V）、低压（24 V）、毫伏。",
 p:"23", qt:"load switching ability — thermostat may be rated for direct switching of line voltage, low voltage, or millivoltage loads", src:"both"},

{s:5, q:"You are converting a house with electric baseboard heat to a gas furnace. Why must you not reuse the old wall thermostat?",
 zh:"把电踢脚线供暖的房子改装燃气炉，为什么不能沿用原来的温控器？",
 a:["It is likely a 120 V line-voltage thermostat; on a 24 V board it can destroy the board or start a fire","It is a millivolt thermostat","It has no heat anticipator","Code bans reusing any thermostat"],
 e:"电暖踢脚线的温控器通常是 120 V 线电压的，别以为它是低压。接到 24 V 的炉子控制板上会烧板，甚至引起火灾。",
 p:"", qt:"", src:"class"},

{s:5, q:"Temperature swing is also known as:",
 zh:"Temperature swing（温度波动）又叫什么？",
 a:["Operating differential","Anticipation","Setback","Cycle rate"],
 e:"温度波动 = 房间达到的最高温度减最低温度，也叫 operating differential（运行差值），可调。",
 p:"28", qt:"Temperature swing, also known as operating differential, is the difference between the highest and lowest temperatures obtained in a room.", src:"both"},

{s:5, q:"What does a thermocouple do for the pilot?",
 zh:"热电偶对长明火起什么作用？",
 a:["It proves the pilot flame; if the pilot goes out, it prevents the main gas valve from opening","It ignites the pilot","It regulates pilot gas pressure","It powers the circulating blower"],
 e:"热电偶受热产生毫伏直流电，吸住安全阀；长明火熄灭，电压消失，主阀打不开。",
 p:"15", qt:"The thermocouple is used to prove the pilot flame. If it goes out, the thermocouple prevents the main gas valve from opening.", src:"both"},

{s:5, q:"How does a thermopile produce more voltage than a single thermocouple?",
 zh:"热电堆为什么比单个热电偶电压高？",
 a:["It is many thermocouples connected in series","It is thermocouples connected in parallel","It uses a step-up transformer","It is heated by line voltage"],
 e:"单个热电偶只有 20 到 30 mV；很多个串联成热电堆，能产生几百毫伏。",
 p:"16", qt:"The output of a single thermocouple is very small — 20 to 30 millivolts (mV). Placing a number of single thermocouples in series electrically can create a device known as a thermopile, which generates hundreds of millivolts.", src:"both"},

{s:5, q:"When must the bulb of a sealed bellows control be filled with mercury?",
 zh:"密封波纹管控制器的感温包什么时候必须充水银？",
 a:["For high temperatures, such as in pilot safety controls","For low room temperatures","For all water heaters","Never; mercury is banned in all controls"],
 e:"高温场合（如长明火安全控制，可达约 3000°F）必须用水银；一般温控用类似轻油的液体，上限约 650°F。水银在约 650°F 汽化，产生“快动”效果。",
 p:"14", qt:"For high temperatures, such as 3000 °F (1648 °C) reached in pilot safety controls, the bulb must be filled with mercury.", src:"both"},

{s:5, q:"An operating aquastat is set at 180°F. How does it work?",
 zh:"运行水温控制器设在 180°F，它怎么工作？",
 a:["It is normally closed and opens at 180°F, cutting power to the main gas valve","It is normally open and closes at 180°F","It is normally closed and turns on the gas at 180°F","It is normally open and opens at 180°F"],
 e:"常闭，水温到 180°F 时断开，切断主燃气阀电源；水温降低一个差值后再闭合。",
 p:"34", qt:"The operating aquastat is a normally closed switch that controls the temperature of the water inside the boiler. If the aquastat is set for 180°F (82 °C), the contacts will remain closed until the water reaches this temperature. At this point, the contacts open and cut off power to the main gas valve.", src:"both"},

{s:5, q:"What is the job of a high limit aquastat, and where is it commonly set?",
 zh:"高限水温控制器的作用是什么，一般设多少？",
 a:["Backup safety if the operating aquastat fails; commonly 200°F","Main temperature control; commonly 140°F","Controls the circulator; commonly 120°F","Controls makeup water; commonly 212°F"],
 e:"和运行水温控制器类似，但设得更高（常见 200°F），作为后备保护。有的带手动复位，迫使操作者去查原因。",
 p:"45", qt:"The high limit aquastat is similar to the operating aquastat but is adjusted to a higher water temperature setting [commonly 200°F (93 °C)]. It serves as a backup safety switch in case the operating aquastat fails.", src:"both"},

{s:5, q:"According to the instructor, at what temperature is water considered scalding?",
 zh:"按老师的说法，多少度的水算烫伤水温？",
 a:["140°F","100°F","180°F","212°F"],
 e:"老师说 140°F 算 scalding，120°F 就已经能严重烫伤人。锅炉运行温度远高于这个。",
 p:"", qt:"", src:"class"},

{s:5, q:"What does a low-water cut-off switch do?",
 zh:"低水位切断开关的作用是什么？",
 a:["Opens its contacts and cuts power to the main gas valve if boiler water falls below the minimum level","Adds water when pressure is high","Shuts off the circulator when water is hot","Opens the relief valve"],
 e:"锅炉水位低于最低水位时断开，切断主燃气阀电源。什么时候必须装，由 Boiler and Pressure Vessel 规范规定。老师说：输入功率大或者管路低于锅炉时都要装。",
 p:"43", qt:"If the water level in the boiler falls below the minimum level, the low-water cut-off switch opens its contacts and cuts off power to the main gas valve. The Boiler and Pressure Vessel code lists when and where low water cut-offs are required.", src:"both", flag:"课堂录音里的功率门槛听不清（“4,000 Btu”），考前查规范核实。"},

{s:5, tf:true, q:"It is acceptable to jumper out a limit switch to keep a customer's heat running.",
 zh:"为了让客户有暖气，可以把限温开关跨接掉。",
 a:["True","False"], c:1,
 e:"错。跨接 limit 会去掉对不安全状况的保护，永远不要这样做。",
 p:"", qt:"", src:"class"},

{s:5, q:"An operating pressuretrol cuts out at 5 psig with a 1.5 psi differential. At what pressure do the contacts close again?",
 zh:"运行压力控制器 5 psig 断开，差值 1.5 psi，多少压力时重新闭合？",
 a:["3.5 psig","6.5 psig","1.5 psig","5 psig"],
 e:"5 − 1.5 = 3.5 psig。主设定和差值都可调。",
 p:"38", qt:"Once it has reached this pressure, the contacts open and cuts off power to the main gas valve. The contacts close again when the steam pressure reduces by the differential setting, in this case, down to approximately 3.5 psig (24 kPa).", src:"both"},

{s:5, q:"How does a high-limit pressure control differ from an operating pressure control?",
 zh:"高限压力控制器和运行压力控制器有什么区别？",
 a:["It is set higher, has no differential setting, and has a manual reset","It is set lower and resets automatically","It controls water level instead of pressure","There is no difference"],
 e:"原理一样，但设定更高，没有差值调节，取而代之的是手动复位按钮。",
 p:"52", qt:"Notice the high limit looks similar to the operating controller, but it does not have a differential setting; instead, it has a manual reset push button.", src:"both"},

{s:5, q:"What does a sail switch prove?",
 zh:"风帆开关（sail switch）证实什么？",
 a:["Air flow","Water flow","Gas pressure","Flame presence"],
 e:"Sail switch 是检测空气流动的流量开关，常用于证实燃烧器系统的风量。",
 p:"48", qt:"Flow switches can also be designed to detect air movement. These are called sail switches. A common application of a sail switch is proving air flow for burner systems.", src:"both"},

{s:5, q:"Why do small water-volume boilers need a flow switch?",
 zh:"小水容量锅炉为什么需要流量开关？",
 a:["To prove water is circulating before the burner fires, since low flow can turn the water to steam","To measure gas flow","To prove combustion air","To control water temperature"],
 e:"这类锅炉水少，水流不足就可能变成蒸汽，所以主燃烧器点火前必须证实水泵在循环。",
 p:"47", qt:"They ensure that the pumps are circulating water in the piping system and the boiler before the main burner can fire. Boilers that require flow switches have small water capacities, and their water may turn to steam if the flow of water is inadequate.", src:"both"},

{s:5, q:"A snap disc high-limit switch next to a furnace heat exchanger opens and resets at about:",
 zh:"炉子换热器旁的 snap disc 高限开关大约在多少度断开和复位？",
 a:["Opens near 200°F, resets near 175°F (25°F differential, not adjustable)","Opens near 250°F, resets near 200°F","Opens near 140°F, resets near 120°F","Opens near 180°F, resets near 170°F (adjustable)"],
 e:"约 200°F 断开、约 175°F 自动复位，差值 25°F，由厂家定，不能调。",
 p:"49", qt:"If the temperature of the heat exchanger reaches around 200 °F (93 °C) — the normal setpoint for the high limit — the heat-sensitive bimetal will warp and break the control circuit. Once the temperature lowers to around 175 °F (79 °C), the contacts will automatically reset.", src:"both"},

{s:5, q:"According to the instructor, what is the highest high-limit setting the Code allows on a forced-air furnace?",
 zh:"按老师的说法，规范允许强制送风炉高限最高设到多少？",
 a:["250°F","200°F","350°F","180°F"],
 e:"老师说规范最高 250°F；重力式炉子（没有风机，靠热空气上升，俗称 octopus）允许到 350°F。教材里没写这个数，考前用 Code Compass 核实条款。",
 p:"", qt:"", src:"class", flag:"教材无此数据，来自课堂，需核实。"},

{s:5, q:"State the Wheatstone bridge balancing rule.",
 zh:"惠斯通电桥的平衡条件是什么？",
 a:["When R1/R2 equals R3/R4, the circuit is balanced and no current flows between A and B","When R1 equals R4, maximum current flows between A and B","When all resistors are zero, current flows","When R1 + R2 = R3 + R4, the relay energizes"],
 e:"R1/R2 = R3/R4 时电桥平衡，A、B 之间无电流。",
 p:"16", qt:"The principle states that when the ratio of R1 to R2 is the same as the ratio of R3 to R4, the circuit is in balance (i.e., there is no current flow between A and B).", src:"both"},

{s:5, q:"In an electronic water heater thermostat based on a Wheatstone bridge, what happens when you turn the dial to a higher setting?",
 zh:"用惠斯通电桥的电子热水器温控，调高温度旋钮会怎样？",
 a:["The bridge goes out of balance, current flows between A and B and energizes a relay until the sensor rebalances it","The bridge stays balanced and nothing happens","The sensor resistance becomes zero","The ECO trips"],
 e:"调旋钮改变电阻 → 电桥失衡 → A、B 间有电流 → 继电器吸合 → 点火模块工作。水温上升，传感器电阻变化到重新平衡，电流停止，燃烧停止。",
 p:"17", qt:"When the thermostat dial is set to a given temperature, an imbalance occurs, allowing current to flow between A and B. This current is used to energize a relay, which in turn energizes the ignition control module.", src:"both"},

{s:5, q:"How is a heat anticipator wired, and what does it do?",
 zh:"热预期器（heat anticipator）怎么接线，作用是什么？",
 a:["In series with the heating circuit; it adds a little heat so the thermostat shuts the burner off early","In parallel with the thermostat; it delays burner start","In series with the blower; it speeds up the fan","In parallel with the gas valve; it raises gas pressure"],
 e:"它是温控器里的小电阻加热器，跟加热回路串联，靠回路电流发热（所以要按阀/继电器电流设定）。让温控器提前关火，用余热补上，减少过冲。",
 p:"29", qt:"The anticipator is a small resistive heater in the thermostat itself, which heats when the system is on. This causes the thermostat to shut off the heating system sooner than it would if affected by room temperature only.", src:"both"},

{s:5, q:"What does raising the CPH (cycles per hour) setting on an electronic thermostat do?",
 zh:"电子温控器调高 CPH（每小时循环次数）会怎样？",
 a:["Narrows the differential: shorter run times and less temperature swing","Widens the differential: longer run times","Raises the setpoint","Has no effect on the burner"],
 e:"CPH 调的其实是触点通断的温差。1 CPH 约 3°F，12 CPH 约 0.4°F，运行时间更短、温度波动更小。但太高会短循环，要按设备类型选。老师课上跳过了这题，答案按教材。",
 p:"31", qt:"An adjustment to 12 CPH at the other extreme end of the scale would be trying to maintain a temperature differential of only about 0.4 °F, which would give much shorter run time and less temperature swing.", src:"book"},

{s:5, q:"What CPH setting do most electronic thermostats come pre-set at?",
 zh:"大多数电子温控器出厂 CPH 设为多少？",
 a:["5 or 6 CPH","1 or 2 CPH","9 CPH","12 CPH"],
 e:"出厂多为 5 或 6 CPH。常见推荐：效率低于 90% 的炉子和热水踢脚线 5 CPH，高效炉 3 CPH，电炉 9 CPH。",
 p:"31", qt:"Most electronic thermostats come out of the box set for 5 or 6 CPH.", src:"book"},

/* ---------- 6 ---------- */
{s:6, q:"Gas-pressure switches are required by code on burner systems operating with gas pressures greater than:",
 zh:"燃气压力超过多少时，规范要求燃烧器系统装燃气压力开关？",
 a:["1/2 psig (3.5 kPa)","2 psig","7 in w.c.","5 psig"],
 e:"超过 1/2 psig 的燃烧器系统要装。压力过高或过低时自动断开燃气阀。",
 p:"52", qt:"Gas-pressure switches are required by code on burner systems that operate with gas pressures greater than 1/2 psig (3.5 kPa).", src:"book"},

{s:6, q:"The appliance regulator is set at 3.5 in w.c. Under CSA B149.3, at what pressure must the low gas-pressure switch open?",
 zh:"器具调压器设 3.5 in w.c.，按 B149.3 低压开关在多少压力断开？",
 a:["1.75 in w.c. (50% of setpoint)","2.6 in w.c. (75% of setpoint)","3.5 in w.c.","0.5 in w.c."],
 e:"低燃气压力开关：压力降到调压器设定值的 50% 时断开。3.5 × 50% = 1.75 in w.c.",
 p:"53", qt:"Low gas-pressure switch: The switch opens if the pressure drops to 50% of the regulator setpoint.", src:"both"},

{s:6, q:"Under CSA B149.3, when must a high gas-pressure switch open?",
 zh:"按 B149.3，高燃气压力开关什么时候断开？",
 a:["When the appliance regulator setpoint is exceeded by 25% or more","When pressure exceeds the setpoint by 50%","When pressure exceeds 14 in w.c.","When pressure doubles"],
 e:"高压开关：超过调压器设定值 25% 或以上时断开。记口诀：低 50%，高 25%。老师说这类题书里不一定有，但 TSSA 考试会考。",
 p:"53", qt:"High gas-pressure switch: The switch opens when the appliance regulator setpoint is exceeded by 25% or more.", src:"both"},

{s:6, q:"Flame rod detection systems work on which principle?",
 zh:"火焰棒检测系统基于什么原理？",
 a:["Flame ionization","Thermoelectric effect","Thermal expansion of liquids","Infrared radiation"],
 e:"火焰的热量让空气分子激烈碰撞，产生离子和自由电子，火焰就能导电。",
 p:"55", qt:"They work on the principle of flame ionization, whereby the heat from the flame causes air molecules in and around the flame envelope to collide so forcibly as to propel some electrons out of their atoms, thus producing ions and free electron.", src:"book"},

{s:6, q:"Which flame rod system can mistake a leak to ground for a flame?",
 zh:"哪种火焰棒系统可能把对地漏电误认成火焰？",
 a:["Flame conductivity (AC)","Flame rectification","UV scanner","Thermocouple"],
 e:"Conductivity 系统的火焰电流是交流，分不清漏电和真火焰。Rectification 系统读的是单向脉动直流，对地短路产生的是对称交流信号，会被拒绝。",
 p:"55", qt:"Because the flame current in a conductivity system is AC, this system cannot differentiate between a leakage current and an actual flame current.", src:"both"},

{s:6, q:"Why are metal plates or rods sometimes added to the burner head?",
 zh:"为什么有时要在燃烧器头上加金属片或金属棒？",
 a:["To keep at least a 4:1 ground area to flame rod area for flame rectification","To hold the flame rod in place","To reduce NOx","To cool the burner"],
 e:"火焰整流要求接地面积至少是火焰棒的 4 倍（4:1）。燃烧器头烂了面积不够，可以加金属片补，不一定换燃烧器。",
 p:"55", qt:"To ensure adequate flame rectification, maintain a minimum ratio of 4:1 between ground and flame rod. Metal rods or plates are added to the burner to increase the grounding area.", src:"both"},

{s:6, q:"A flame rectification signal is measured with a:",
 zh:"火焰整流信号用什么仪表测？",
 a:["DC microammeter","AC voltmeter","Ohmmeter","Manometer"],
 e:"虽然供的是交流，但接地面积远大于火焰棒，产生脉动直流，用直流微安表测。",
 p:"57", qt:"The resultant current acts like a pulsating DC. The flame signal in a rectified system should be steady and can be measured with a DC microammeter.", src:"book"},

{s:6, q:"What do UV and IR flame sensors detect?",
 zh:"UV 和 IR 火焰传感器检测什么？",
 a:["Ultraviolet and infrared radiation (light) given off by the flame","Ions in the flame","Heat at a thermocouple junction","Pressure in the combustion chamber"],
 e:"UV 管检测紫外辐射；IR 传感器用硫化铅电池，遇红外线电阻下降。火焰辐射约 90% 是红外、6% 可见光、3% 紫外。",
 p:"58", qt:"An ultraviolet sensing tube can detect the radiant energy in a flame... The main element of the infrared sensor is a lead sulphide cell that is used as an electrical switch.", src:"both"},

{s:6, q:"What device is used to sense combustion air or flue gas flow on any appliance with a fan or blower?",
 zh:"有风机的设备，用什么检测燃烧空气或烟气流量？",
 a:["Air proving switch","Flow switch","Pressuretrol","Gas pressure switch"],
 e:"风压开关是灵敏的膜片压力开关，把风机运行和火焰保护联锁起来。",
 p:"59", qt:"Air-proving switches interlock the burner fan operation with the flame safeguard control. They are used to sense combustion air or flue gas flow on any appliance that incorporates a fan or blower.", src:"both"},

{s:6, q:"An air pressure switch is rated 0.5 in w.c. According to the instructor's trade tip, about how much should the inducer pull or push?",
 zh:"风压开关额定 0.5 in w.c.，按老师的经验，引风机应该做到多少？",
 a:["About double the rating, around 1.0 in w.c.","Exactly 0.5 in w.c.","About 0.6 in w.c.","At least 3.5 in w.c."],
 e:"老师的经验：引风机压力约为开关额定值的两倍。0.5 的开关要做到 1.0 左右；只有 0.92 就要查排烟问题，有时在出口加缩径增加阻力。教材只写单管开关至少需要 0.50 in w.c. 的压降才闭合。",
 p:"59", qt:"The pressure switch shown in Figure 1-58 has a single sensing hose connected to the negative side of the induced vent blower, requiring at least a 0.50 inch w.c pressure fall (WCPF) to complete the control circuit.", src:"both", flag:"“两倍”是老师的现场经验，不是教材原文。"},

{s:6, q:"A flame signal is present before the burner lights. What does the flame safeguard do?",
 zh:"燃烧器点火前就检测到火焰信号，火焰保护器怎么处理？",
 a:["It fails the safe start check and will not start the burner","It ignores the signal and starts normally","It opens the main valve early","It increases the trial for ignition time"],
 e:"FSG 至少要做 safe start check：点火前有模拟火焰的情况就不允许启动。",
 p:"72", qt:"As a minimum check, the flame safeguard control prevents burner start-up if a flame simulating condition is present prior to burner activation. This is called the safe start check function.", src:"both"},

{s:6, q:"Which basic flame safeguard function cuts off the fuel when the flame is lost?",
 zh:"火焰保护器哪项基本功能在失火时切断燃料？",
 a:["Flame supervision","Safe start check","Burner sequencing","Pre-purge"],
 e:"FSG 三项基本功能：自检（safe start）、燃烧器程序控制、火焰监视。没有火焰就切断自动燃料供应，这是火焰监视。",
 p:"72", qt:"An FSG supervises the ignition and continued presence of a safe flame by de-energizing the automatic fuel supply if the flame is not present.", src:"both"},

{s:6, q:"What extra features can a programming flame safeguard add over a primary (non-programming) control?",
 zh:"程序型火焰保护器比基本型多了哪些功能？",
 a:["Pre-purge with proven air flow, low fire start, timed trials for ignition","Only flame supervision","Thermostat scheduling","Gas pressure regulation"],
 e:"程序型可加：带风量证实的预吹扫、低火启动、定时长明火/主火试点火、联锁监视、高低火切换、显示和存储数据。",
 p:"76", qt:"These added features may include: a pre-purge with a proven air flow and capacity; a low fire start positioning; timed pilot trial for ignition; timed main flame trial for ignition (interrupted pilot); monitoring of start and running interlocks...", src:"both"},

/* ---------- 7 ---------- */
{s:7, q:"When should a water shut-off valve on a boiler or water heater be closed?",
 zh:"锅炉或热水器的水关断阀什么时候关？",
 a:["Only to isolate the appliance for repair or servicing","During normal operation to save water","Whenever the burner is off","When the boiler reaches temperature"],
 e:"这些阀平时常开，只在维修时关来隔离设备。运行中关掉，系统缺水时补不进水。",
 p:"79", qt:"They are normally open valves that can be shut off to isolate an appliance for repair or servicing.", src:"both"},

{s:7, q:"What lets a globe valve throttle flow for long periods?",
 zh:"截止阀（globe valve）为什么能长期节流？",
 a:["Its design keeps seat erosion to a minimum","It has a gate that moves up and down","It is always fully open","It has a Teflon ball"],
 e:"截止阀的结构让阀座冲蚀最小，适合经常节流调节，比如锅炉旁通。闸阀（gate valve）部分开启会振动磨损，只能全开或全关。",
 p:"80", qt:"Globe valves, unlike gate valves, are designed for steady use in applications with frequent throttling or flow regulation. The design of the globe valve keeps the seat erosion to a minimum.", src:"both"},

{s:7, q:"Where does the sensing stem of a water heater T&P relief valve sit?",
 zh:"热水器 T&P 泄压阀的感温杆在哪个位置？",
 a:["In the water within the top six inches of the tank","At the bottom of the tank","In the flue","At the cold water inlet"],
 e:"感温杆伸进水箱顶部 6 英寸以内的水中。换热水器时也要换新 T&P 阀。",
 p:"81", qt:"The sensing stem of this valve extends into the water within the top six inches of the tank.", src:"both"},

{s:7, q:"How does a feedwater valve work with a low-water cut-off?",
 zh:"补水阀和低水位切断怎么配合？",
 a:["On low water, the cut-off shuts down the burner and powers the feedwater valve to add makeup water","It adds water only when the burner runs","It drains water when pressure is high","It shuts the circulator off"],
 e:"检测到低水位：停燃烧器，同时让补水阀进水。",
 p:"82", qt:"Upon sensing a low water condition, the boiler low-water cut-off shuts down the burner and powers the feedwater control that lets in makeup water.", src:"both"},

{s:7, q:"On what type of appliance is a rod and tube (Unitrol) valve typically installed?",
 zh:"杆管式（Unitrol）组合阀一般装在什么设备上？",
 a:["Storage water heater","Furnace","Gas range","Boiler"],
 e:"Unitrol 是储水式热水器上的多功能阀，靠铜管和殷钢棒热胀差感温。",
 p:"93", qt:"The rod and tube combination gas valve is a multi-purpose valve typically installed in storage type water heaters.", src:"both"},

{s:7, q:"What trips the ECO on a Unitrol valve, and what does it cut power to?",
 zh:"Unitrol 阀上的 ECO 什么情况下断开，切断哪里的电？",
 a:["Water temperature above about 200°F melts the fuse; it cuts current to the safety valve coil","Low gas pressure; it cuts power to the igniter","High flue temperature; it cuts power to the blower","Low water level; it cuts power to the thermostat"],
 e:"ECO 是和安全阀线圈串联的熔断件，超过约 200°F 熔断，切断热电偶到安全阀线圈的电流，全部燃气关闭。多数是一次性的，跳了要换阀。",
 p:"93", qt:"The ECO is a fusible link wired in series with the safety valve solenoid. If the temperature-sensitive fuse exceeds 200°F, the fuse will melt, and the electrical current to the safety valve power unit coil will be interrupted, shutting all of the gas off.", src:"both"},

{s:7, q:"What acts as extra protection on a redundant gas valve?",
 zh:"冗余燃气阀额外的保护是什么？",
 a:["A second automatic shut-off valve in the valve body","A servo regulator","A pilot adjustment screw","An on/off switch"],
 e:"冗余阀是 100% 安全关断型，阀体里还有第二个自动关断阀，避免没有点火源时燃气进入燃烧室。",
 p:"99", qt:"It is of the 100% safety shut-off type with, as extra protection, a second shut-off valve incorporated in the valve body.", src:"book"},

{s:7, q:"Why must a seismic gas valve be installed level, and how is it reset?",
 zh:"地震切断阀为什么要水平安装，怎么复位？",
 a:["An internal ball rolls on horizontal vibration; it must be manually reset","It uses a float; it resets automatically","It has a spring that needs gravity; reset by power cycling","It uses a mercury switch; it resets when vibration stops"],
 e:"阀里有一个钢球，水平振动时滚动关阀，所以必须装平；动作后要手动复位。",
 p:"106", qt:"Both of which need to be installed level as they have an internal ball that rolls when subject to horizontal vibration. They have an indicating window and must be manually reset once activated.", src:"both"},

{s:7, q:"How is a cable release fire suppression gas valve closed?",
 zh:"拉索式灭火联动燃气阀怎么关闭？",
 a:["A manual pull station or a fusible link releases the cable","Only by a manual pull station","By a smoke detector signal through 24 V","By low gas pressure"],
 e:"阀被拉索保持开启，手动拉站或灶具上方的温度熔断件都能释放拉索关阀，同时释放灭火剂。用于商用厨房，动作后要手动复位。",
 p:"107", qt:"The system shown has a release-to-close valve, which is being held open by a cable that can be released by a manual pull station, or a temperature activated fusible link located above the cooking equipment.", src:"both"}
];
