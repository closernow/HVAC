const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},key,u8(CT));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:u8(SALT),iterations:ITER},base,256));
}
(async()=>{ try{ const s=localStorage.getItem(RK); if(s){ await open_(u8(s)); } }catch(e){ try{localStorage.removeItem(RK)}catch(_){} } })();
document.getElementById("f").onsubmit=async e=>{
  e.preventDefault(); const m=document.getElementById("msg"), g=document.getElementById("go");
  g.disabled=true; m.textContent=""; g.textContent="解密中…";
  try{ const raw=await derive(document.getElementById("pw").value.trim());
    await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]).then(k=>crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},k,u8(CT)));
    if(document.getElementById("rm").checked){ try{ localStorage.setItem(RK,btoa(String.fromCharCode(...raw))); }catch(_){} }
    await open_(raw);
  }catch(err){ m.textContent="密码不对，再试一次"; g.disabled=false; g.textContent="打开"; }
};
