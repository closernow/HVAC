<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1084 期中练习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen study tool. Sticky top bar (progress + filters), centred question card styled like an equipment rating plate, fixed bottom nav sized for thumbs. */
:root{
  --bg:#e9edf0; --surface:#ffffff; --surface-2:#f4f6f8; --ink:#16212c; --muted:#596876; --line:#cfd7de;
  --accent:#1d5bc9; --accent-ink:#ffffff; --accent-soft:#e2ebfb;
  --ok:#1d7f48; --ok-soft:#e1f3e8; --bad:#c2362b; --bad-soft:#fbe5e2; --warn:#9a5a00; --warn-soft:#fdf1dc; --star:#c98a00;
  --shadow:0 1px 2px rgba(22,33,44,.06),0 4px 16px rgba(22,33,44,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --fs:1; --fig-bg:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1419; --surface:#161f27; --surface-2:#1c2731; --ink:#e4eaf0; --muted:#94a3b1; --line:#2a3743;
  --accent:#6ea3ff; --accent-ink:#0b1420; --accent-soft:#1a2b45;
  --ok:#4cc184; --ok-soft:#12301f; --bad:#ff8074; --bad-soft:#3a1916; --warn:#e7a94a; --warn-soft:#33240c; --star:#f0b72f;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1419; --surface:#161f27; --surface-2:#1c2731; --ink:#e4eaf0; --muted:#94a3b1; --line:#2a3743;
  --accent:#6ea3ff; --accent-ink:#0b1420; --accent-soft:#1a2b45;
  --ok:#4cc184; --ok-soft:#12301f; --bad:#ff8074; --bad-soft:#3a1916; --warn:#e7a94a; --warn-soft:#33240c; --star:#f0b72f;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:calc(15px * var(--fs));line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px;padding-block:10px 6px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:.02em;line-height:1;margin:0;white-space:nowrap}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:.04em;margin-top:3px}
.spacer{flex:1}
.seg{display:inline-flex;flex:none;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:6px;font-size:.85rem;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.topics{padding-top:12px}
.topics-head{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);margin-bottom:8px}
.topics-head b{color:var(--ink);font-weight:600}
.topics-head button{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 10px;font-size:.78rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .grp{flex-basis:100%;height:0}
/* 收起时：所有主题挤成一行，左右滑动查看 */
.chips.collapsed{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chips.collapsed .grp{display:none}
.chips.collapsed .chip{flex:none;white-space:nowrap}
[hidden]{display:none!important}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem;color:var(--muted);text-align:left;max-width:100%}
.chip b{font-family:var(--f-mono);font-weight:500;margin-left:4px;font-size:.75rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.prog{display:flex;align-items:center;gap:10px;padding-bottom:10px;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;display:flex;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-bad{background:var(--bad)}

/* main */
main{padding-block:12px calc(110px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.plate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px dashed var(--line);background:var(--surface-2);font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.plate .qn{font-family:var(--f-display);font-size:1.15rem;font-weight:700;color:var(--ink);letter-spacing:.03em}
.tag{border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:var(--surface);white-space:nowrap}
.tag.tf{border-color:var(--accent);color:var(--accent)}
.star{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;display:inline-flex;gap:5px;align-items:center;font-family:var(--f-body);font-size:.78rem;color:var(--muted)}
.star svg{width:15px;height:15px}
.star[aria-pressed="true"]{color:var(--star);border-color:var(--star)}
.star[aria-pressed="true"] svg{fill:var(--star)}
.qbody{padding:16px 16px 6px}
.qtext{font-size:1.12em;font-weight:500;margin:0;text-wrap:pretty}
.qtext.tap{cursor:pointer}
.qzh{margin:8px 0 0;color:var(--muted);font-size:.92em}
.ztip{display:inline-block;margin-top:8px;font-size:.75rem;color:var(--accent);border:1px dashed var(--accent);border-radius:4px;padding:1px 7px;background:none}
.opt .zh{display:block;margin-top:4px;font-size:.88em;color:var(--muted)}
.opt.right .zh,.opt.wrong .zh{color:inherit;opacity:.85}
.reveal{padding:0 16px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--muted)}
.reveal .btn{padding:6px 12px;font-size:.82rem}
.opts{display:grid;gap:10px;padding:14px 16px 16px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;min-height:52px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:.85rem;background:var(--surface-2);border:1px solid var(--line)}
.opt .t{flex:1;min-width:0;padding-top:1px}
.opt .m{flex:none;font-weight:600;font-size:.8rem;padding-top:3px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.right .m{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt.wrong .m{color:var(--bad)}
.opt.dim{opacity:.55}
.opt.tried-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.tried-wrong .k{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt.tried-wrong .m{color:var(--bad)}
.opt[disabled]{cursor:default}
.hint{padding:0 16px 14px;font-size:.78rem;color:var(--muted)}

.exp{border-top:1px solid var(--line);padding:14px 16px 16px;display:grid;gap:12px}
.verdict{display:flex;align-items:center;gap:8px;font-weight:600}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.verdict .redo{margin-left:auto;font-weight:500;font-size:.8rem;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;color:var(--muted)}
.exp p{margin:0}
.src{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pg{font-family:var(--f-mono);font-size:.8rem;font-weight:500;background:var(--ink);color:var(--surface);border-radius:4px;padding:2px 8px}
.badge{font-size:.75rem;border-radius:4px;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
.badge.cls{border-color:var(--accent);color:var(--accent)}
blockquote{margin:0;padding:10px 12px;border-left:3px solid var(--ink);background:var(--surface-2);border-radius:0 6px 6px 0;font-family:var(--f-mono);font-size:.82em;line-height:1.6;overflow-wrap:anywhere}
blockquote .tr{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-family:var(--f-body);font-size:1.05em;color:var(--ink)}
blockquote cite{display:block;font-style:normal;color:var(--muted);font-family:var(--f-body);font-size:.75rem;margin-bottom:4px}
.flag{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:.85em}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.nav .wrap{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.nbtn{height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.nbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nbtn[disabled]{opacity:.4;cursor:default}
.nbtn svg{width:18px;height:18px}
.gridbtn{height:48px;min-width:84px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-family:var(--f-mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.kbd{max-width:760px;margin:6px auto 0;padding-inline:16px;font-size:.72rem;color:var(--muted);text-align:center}
.brand{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.kbd{display:none}.seg button{padding:6px 8px}.brand small{display:none}.brand{font-size:1.15rem}.top-row{gap:8px}}
@media (max-width:360px){.brand{font-size:1rem}}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:14px 14px 0 0;max-height:82vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet-inner{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-family:var(--f-display);font-size:1.3rem;letter-spacing:.02em}
.sheet-body{overflow-y:auto;padding:14px 16px 18px;display:grid;gap:16px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);display:inline-block}
.secblock h3{margin:0 0 8px;font-size:.82rem;color:var(--muted);font-weight:600}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.cell{height:40px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:.8rem;position:relative;font-variant-numeric:tabular-nums}
.cell.c-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.c-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.c-ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell .mk{position:absolute;top:2px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--star)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;padding-block:6px;flex-wrap:wrap}
.row label{flex:1 1 180px;min-width:0}
.row label{font-weight:500}
.row .sub{display:block;font-size:.78rem;color:var(--muted);font-weight:400}
.switch{width:46px;height:28px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{left:21px;background:var(--accent-ink)}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.sectbl{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
.sectbl td,.sectbl th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.sectbl td:last-child,.sectbl th:last-child{text-align:right}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--f-display);color:var(--ink);margin:0 0 6px}

.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;max-width:380px;width:100%;padding:18px;display:grid;gap:12px;box-shadow:var(--shadow)}
.modal h3{margin:0;font-size:1.05rem}
.modal p{margin:0;color:var(--muted);font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:.85rem;z-index:60}
.timer{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.fig{margin:14px 0 2px;display:flex;justify-content:center}
.fig img{background:var(--fig-bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-width:100%;height:auto;image-rendering:auto}
.fig.sym img{width:200px}
.fig.tbl img{width:100%;max-width:640px}
.tag.hot{border-color:var(--star);color:var(--star)}
.tag.hw{border-color:var(--ok);color:var(--ok)}
.tag.ex{background:var(--star);border-color:var(--star);color:#1a1200;font-weight:600}
.tag.miss{border-color:var(--bad);color:var(--bad)}
.tag.nx{border-style:dashed}
.badge.ex{border-color:var(--star);color:var(--star)}
.badge.hw{border-color:var(--ok);color:var(--ok)}
.pg.cl{background:var(--accent);color:var(--accent-ink)}
</style>

  <div class="wrap">
    <div class="top-row">

],

<script>
(function(){
const KEY = "fol1084-midterm-v1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
QUESTIONS.forEach((q,i)=>{ q.id = i; });

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const S = Object.assign({
  mode:"practice", filter:"all", pos:{}, ans:{}, marks:{}, perm:{}, order:null,
  shuffleQ:false, fs:1, exam:null, tries:{}, solved:{}, zhStem:"tap", zhOpt:"pick", topicsOpen:true
}, load());
let stemOpen = false;

function perm(q){
  if(q.tf || q.fx) return q.a.map((_,i)=>i);
  if(!S.perm[q.id] || S.perm[q.id].length !== q.a.length){ S.perm[q.id] = shuffle(q.a.map((_,i)=>i)); }
  return S.perm[q.id];
}
function correctIdx(q){ return q.c; }
function baseOrder(){
  if(!S.order || S.order.length !== QUESTIONS.length){ S.order = QUESTIONS.map(q=>q.id); }
  return S.shuffleQ ? S.order : QUESTIONS.map(q=>q.id);
}

/* list of question ids for the current view */
function list(){
  if(S.mode === "exam" && S.exam) return S.exam.ids;
  const ids = baseOrder();
  const f = S.filter;
  if(f === "all") return ids;
  if(f === "wrong") return (S.wrongSnap || []).filter(id=>ids.includes(id)).sort((a,b)=>ids.indexOf(a)-ids.indexOf(b));
  if(f === "marked") return ids.filter(id=>S.marks[id]);
  if(f === "hot") return ids.filter(id=>QUESTIONS[id].hot);
  if(f === "hw") return ids.filter(id=>QUESTIONS[id].hw);
  if(f === "ex") return ids.filter(id=>QUESTIONS[id].ex);
  if(f === "ppt") return ids.filter(id=>QUESTIONS[id].fc||QUESTIONS[id].rv);
  if(f === "miss") return ids.filter(id=>QUESTIONS[id].miss);
  if(f === "todo") return (S.todoSnap || []).filter(id=>ids.includes(id)).sort((a,b)=>ids.indexOf(a)-ids.indexOf(b));
  return ids.filter(id=>QUESTIONS[id].s === +f);
}
function viewKey(){ return S.mode === "exam" ? "exam" : S.filter + (S.shuffleQ ? ":r" : ""); }
function curPos(){ const L=list(); let p=S.pos[viewKey()]||0; if(p>=L.length) p=Math.max(0,L.length-1); return p; }
function setPos(p){ S.pos[viewKey()] = p; stemOpen=false; save(); render(); scrollTop(); try{ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); }catch(e){} }
function scrollTop(){ try{ window.scrollTo({top:0, behavior:"instant"}); }catch(e){ window.scrollTo(0,0); } }

function answersFor(){ return S.mode==="exam" && S.exam ? S.exam.ans : S.ans; }
function revealed(id){
  if(S.mode === "exam") return !!(S.exam && S.exam.done);
  return !!S.solved[id];
}

/* ---------- chips ---------- */
function wrongIds(){ return QUESTIONS.filter(q=>S.ans[q.id]!=null && S.ans[q.id]!==correctIdx(q)).map(q=>q.id); }
function renderChips(){
  const box = $("#topics"), el = $("#chips");
  if(S.mode === "exam"){ box.hidden = true; return; }
  box.hidden = false;
  const label = {all:"全部",wrong:"错题本",todo:"未做",marked:"已标记",ex:"考卷原题",ppt:"复习 PPT",hot:"老师强调",hw:"FOL 作业",miss:"FOL 做错过"}[S.filter] || (()=>{ const t=SECTIONS.find(x=>String(x.id)===S.filter); return t? t.id+" "+t.name : "全部"; })();
  $("#cur-topic").textContent = label;
  $("#topics-toggle").textContent = S.topicsOpen ? "收成一行" : "展开全部";
  $("#topics-toggle").onclick = ()=>{ S.topicsOpen=!S.topicsOpen; save(); renderChips(); };
  el.classList.toggle("collapsed", !S.topicsOpen);
  const chip = ([k,l,n])=>`<button class="chip" data-f="${k}" aria-pressed="${S.filter===k}">${esc(l)}<b>${n}</b></button>`;
  const a = [["all","全部",QUESTIONS.length]];
  const secs = SECTIONS.map(t=>[String(t.id), t.id+" "+t.name, QUESTIONS.filter(q=>q.s===t.id).length]);
  const b = [["wrong","错题本", wrongIds().length],["todo","未做", QUESTIONS.filter(q=>S.ans[q.id]==null).length],["marked","已标记", Object.keys(S.marks).filter(k=>S.marks[k]).length],["ex","考卷原题",QUESTIONS.filter(q=>q.ex).length],["ppt","复习 PPT",QUESTIONS.filter(q=>q.fc||q.rv).length],["hot","老师强调",QUESTIONS.filter(q=>q.hot).length],["hw","FOL 作业",QUESTIONS.filter(q=>q.hw).length],["miss","FOL 做错过",QUESTIONS.filter(q=>q.miss).length]];
  el.innerHTML = a.concat(b).map(chip).join("") + '<span class="grp"></span>' + secs.map(chip).join("");
  el.querySelectorAll(".chip").forEach(x=>x.onclick=()=>setFilter(x.dataset.f));
  if(!S.topicsOpen){ const on=el.querySelector('[aria-pressed="true"]'); if(on) el.scrollLeft = on.offsetLeft - el.offsetLeft - 16; }
}
function setFilter(f){
  S.filter = f;
  if(f==="wrong") S.wrongSnap = wrongIds();
  if(f==="todo") S.todoSnap = QUESTIONS.filter(q=>S.ans[q.id]==null).map(q=>q.id);
  save(); render(); scrollTop();
}

/* ---------- progress ---------- */
function renderProgress(){
  const L = list(), A = answersFor();
  let ok=0,bad=0,done=0;
  L.forEach(id=>{ const v=A[id]; if(v!=null){ done++; if(S.mode!=="exam"||S.exam.done){ v===correctIdx(QUESTIONS[id])?ok++:bad++; } } });
  const p = curPos();
  let t = L.length ? `第 ${p+1}/${L.length} 题 · 已答 ${done}` : "没有题目";
  if((S.mode!=="exam"||S.exam.done) && done) t += ` · 正确率 ${Math.round(ok/done*100)}%`;
  $("#prog-text").textContent = t;
  const n = L.length || 1;
  $("#bar").innerHTML = S.mode==="exam" && !S.exam.done
    ? `<i class="b-ok" style="width:${done/n*100}%;background:var(--accent)"></i>`
    : `<i class="b-ok" style="width:${ok/n*100}%"></i><i class="b-bad" style="width:${bad/n*100}%"></i>`;
  $("#btn-grid").textContent = L.length ? `${p+1} / ${L.length}` : "0 / 0";
}

/* ---------- question ---------- */
const STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';
function renderQuestion(){
  const main = $("#main"), L = list();
  if(!L.length){
    const msg = {wrong:["错题本是空的","第一次就选错的题会自动收进来。"], marked:["还没有标记的题","做题时点右上角的「标记」，把没把握的题收起来。"], todo:["全部做完了","可以去错题本复习，或者在设置里清空记录重来。"]}[S.filter] || ["没有题目",""];
    main.innerHTML = `<div class="card empty"><h2>${msg[0]}</h2><p>${msg[1]}</p><div class="btns" style="justify-content:center;margin-top:12px"><button class="btn" id="go-all">回到全部题目</button></div></div>`;
    $("#go-all").onclick=()=>setFilter("all");
    return;
  }
  const exam = S.mode==="exam";
  const p = curPos(), q = QUESTIONS[L[p]], ci = correctIdx(q), show = revealed(q.id);
  const sec = SECTIONS.find(x=>x.id===q.s);
  const order = perm(q);
  const letters = q.tf ? ["T","F"] : ["A","B","C","D","E","F"];
  const tries = exam ? [] : (S.tries[q.id]||[]);
  const chosenExam = exam ? S.exam.ans[q.id] : null;
  const optZh = (oi)=> q.az[oi];

  const opts = order.map((oi,k)=>{
    let cls="opt", mark="", zh="";
    if(exam){
      if(show){ if(oi===ci){cls+=" right";mark="✓ 正确答案";} else if(oi===chosenExam){cls+=" wrong";mark="✗ 你的选择";} else cls+=" dim"; }
      else if(oi===chosenExam) cls+=" sel";
    } else {
      const tried = tries.includes(oi);
      if(tried){ if(oi===ci){cls+=" right";mark="✓ 正确";} else {cls+=" tried-wrong";mark="✗ 不对";} }
      else if(show && oi===ci){ cls+=" right"; mark="✓ 正确答案"; }
      if(S.zhOpt==="on" || (S.zhOpt==="pick" && (tried || (show && oi===ci)))) zh=`<span class="zh">${esc(optZh(oi))}</span>`;
    }
    return `<button class="${cls}" data-oi="${oi}" ${exam&&show?"disabled":""}><span class="k">${letters[k]}</span><span class="t">${esc(q.a[oi])}${zh}</span>${mark?`<span class="m">${mark}</span>`:""}</button>`;
  }).join("");

  // stem chinese
  let stemZh = "", tapCls = "";
  if(!exam){
    if(S.zhStem==="on") stemZh = `<p class="qzh">${esc(q.zh)}</p>`;
    else if(S.zhStem==="tap"){ tapCls=" tap"; stemZh = stemOpen ? `<p class="qzh">${esc(q.zh)}</p>` : `<button class="ztip" id="ztip">点题干看中文</button>`; }
  }

  let exp = "";
  if(show){
    let verdict;
    if(exam){ const v=chosenExam; verdict = v==null?["","未作答"]:(v===ci?["ok","答对了"]:["bad","答错了"]); }
    else { const first=S.ans[q.id]; verdict = first==null?["","已查看答案"]:(first===ci?["ok","第一次就答对了"]:["bad",`第一次答错了，试了 ${tries.length} 次`]); }
    const srcs = [];
    if(q.ex) srcs.push('<span class="badge ex">10/5 老师翻考卷讲过</span>');
    if(q.rv) srcs.push('<span class="badge cls">10/5 复习课讲过</span>');
    if(q.hw) srcs.push(q.u20 ? '<span class="badge hw">FOL Unit 18 Test</span>' : '<span class="badge hw">FOL 作业 = 课后习题</span>');
    if(q.fc) srcs.push('<span class="badge">复习闪卡</span>');
    if(q.tb) srcs.push('<span class="badge">课本补充</span>');
    if(q.hot && !q.ex) srcs.push('<span class="badge ex">老师说会考 / 按书答</span>');
    const src = srcs.join("");
    const pg = q.p ? `<span class="pg">${q.u20?"Unit 20":"Unit 18"} p.${esc(q.p)}</span>` : "";
    const cl = "";
    exp = `<section class="exp" aria-live="polite">
      <div class="verdict ${verdict[0]}">${verdict[1]}${exam?"":'<button class="redo" id="redo">重做本题</button>'}</div>
      <p>${esc(q.e)}</p>
      <div class="src">${pg}${cl}${src}</div>
      ${q.nx?`<div class="flag">老师说按 CFM 查表的题考试会删掉，这题了解一下就行。</div>`:""}
    </section>`;
  }
  let foot = "";
  if(exam && !show) foot = `<div class="hint">模拟考：选完不显示对错，也不显示中文。交卷前可以改答案。</div>`;
  if(!exam && !show) foot = `<div class="reveal"><span>${tries.length?"不对，可以继续试其他选项。":"每个选项都可以点，点了显示对错，选对了才出解析。"}</span><button class="btn" id="show-ans">直接看答案</button></div>`;

  main.innerHTML = `<article class="card">
    <div class="plate"><span class="qn">Q${String(p+1).padStart(3,"0")}</span><span class="tag">${sec.id} · ${esc(sec.name)}</span>${q.tf?'<span class="tag tf">True / False</span>':""}${q.ex&&!exam?'<span class="tag ex">考卷原题</span>':""}${(q.fc||q.rv)&&!exam?'<span class="tag hot">复习 PPT</span>':""}${q.hot&&!exam?'<span class="tag hot">老师强调</span>':""}${q.hw&&!exam?`<span class="tag hw">${q.u20?"FOL Test":"FOL 作业"}</span>`:""}${q.miss&&!exam?'<span class="tag miss">做错过</span>':""}${q.nx&&!exam?'<span class="tag nx">不考</span>':""}
      <button class="star" id="star" aria-pressed="${!!S.marks[q.id]}">${STAR}${S.marks[q.id]?"已标记":"标记"}</button></div>
    <div class="qbody"><p class="qtext${tapCls}" id="qtext">${esc(q.q)}</p>${stemZh}${q.img?`<div class="fig tbl"><img src="${IMG[q.img]}" alt="Table 5 HUD-FHA 热水器最小容量表"></div>`:""}</div>
    <div class="opts">${opts}</div>${foot}${exp}
  </article>`;
  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(q, +b.dataset.oi));
  $("#star").onclick=()=>toggleMark(q.id);
  if(tapCls){ const t=()=>{ stemOpen=!stemOpen; renderQuestion(); }; $("#qtext").onclick=t; const z=$("#ztip"); if(z) z.onclick=t; }
  const r = $("#redo"); if(r) r.onclick=()=>{ delete S.ans[q.id]; delete S.tries[q.id]; delete S.solved[q.id]; save(); render(); };
  const sa = $("#show-ans"); if(sa) sa.onclick=()=>{ S.solved[q.id]=true; if(S.ans[q.id]==null) S.ans[q.id]=-1; save(); render(); scrollToExp(); };
}
function scrollToExp(){
  const ex = document.querySelector(".exp");
  if(ex && ex.getBoundingClientRect().top > window.innerHeight - 160){ ex.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"}); }
}
function choose(q, oi){
  if(S.mode==="exam"){ if(S.exam.done) return; S.exam.ans[q.id] = oi; save(); render(); return; }
  const t = S.tries[q.id] = S.tries[q.id] || [];
  if(!t.includes(oi)) t.push(oi);
  if(S.ans[q.id]==null) S.ans[q.id] = oi;          // first try counts for score and wrong book
  const wasSolved = !!S.solved[q.id];
  if(oi===correctIdx(q)) S.solved[q.id] = true;
  save(); render();
  if(!wasSolved && S.solved[q.id]) scrollToExp();
}
function toggleMark(id){ if(S.marks[id]) delete S.marks[id]; else S.marks[id]=true; save(); render(); toast(S.marks[id]?"已标记，可在「已标记」里集中复习":"已取消标记"); }

/* ---------- nav ---------- */
function renderNav(){
  const L=list(), p=curPos();
  $("#btn-prev").disabled = p<=0 || !L.length;
  const nx = $("#btn-next");
  const last = p>=L.length-1;
  if(S.mode==="exam" && S.exam && !S.exam.done && last){ nx.innerHTML = "交卷"; nx.disabled=false; nx.dataset.act="submit"; }
  else if(S.mode==="exam" && S.exam && S.exam.done && last){ nx.innerHTML = "成绩"; nx.disabled=false; nx.dataset.act="result"; }
  else { nx.innerHTML = '下一题<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>'; nx.disabled = last || !L.length; nx.dataset.act="next"; }
}
function next(){ const L=list(), p=curPos(); const a=$("#btn-next").dataset.act; if(a==="submit") return confirmSubmit(); if(a==="result") return showResult(); if(p<L.length-1) setPos(p+1); }
function prev(){ const p=curPos(); if(p>0) setPos(p-1); }
$("#btn-next").onclick=next; $("#btn-prev").onclick=prev; $("#btn-grid").onclick=openGrid;

/* ---------- sheets / modal ---------- */
function closeLayer(){ $("#layer").innerHTML=""; document.body.style.overflow=""; }
function sheet(title, body, extraHead){
  $("#layer").innerHTML = `<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-inner"><div class="sheet-head"><h2>${esc(title)}</h2><span class="spacer"></span>${extraHead||""}<button class="icon-btn" id="sheet-x" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sheet-body">${body}</div></div></div>`;
  document.body.style.overflow="hidden";
  $("#scrim").onclick=closeLayer; $("#sheet-x").onclick=closeLayer;
}
function modal(title, text, okText, onOk, danger){
  const wrap = document.createElement("div");
  wrap.innerHTML = `<div class="scrim" style="z-index:49"></div><div class="modal" role="alertdialog" aria-modal="true"><div class="box"><h3>${esc(title)}</h3><p>${text}</p><div class="btns" style="justify-content:flex-end"><button class="btn" data-x>取消</button><button class="btn ${danger?"danger":"primary"}" data-ok>${esc(okText)}</button></div></div></div>`;
  document.body.appendChild(wrap);
  const close=()=>wrap.remove();
  wrap.querySelector("[data-x]").onclick=close; wrap.querySelector(".scrim").onclick=close;
  wrap.querySelector("[data-ok]").onclick=()=>{ close(); onOk(); };
  wrap.querySelector("[data-ok]").focus();
}
let toastT;
function toast(msg){ let t=$("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t);} t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,1800); }

function cellClass(id){
  const A=answersFor(), v=A[id];
  if(v==null) return "";
  if(S.mode==="exam" && !S.exam.done) return "c-ans";
  return v===correctIdx(QUESTIONS[id]) ? "c-ok" : "c-bad";
}
function openGrid(){
  const L=list(), p=curPos();
  const groups = {};
  L.forEach((id,i)=>{ const s=QUESTIONS[id].s; (groups[s]=groups[s]||[]).push([id,i]); });
  const useGroups = S.mode!=="exam" && !S.shuffleQ;
  const cell = ([id,i])=>`<button class="cell ${cellClass(id)} ${i===p?"cur":""}" data-i="${i}" aria-label="第${i+1}题">${i+1}${S.marks[id]?'<span class="mk"></span>':""}</button>`;
  let body = `<div class="legend"><span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>答对</span><span><i style="background:var(--bad-soft);border-color:var(--bad)"></i>答错</span><span><i style="background:var(--accent-soft);border-color:var(--accent)"></i>已答（未交卷）</span><span><i></i>未做</span><span><i style="background:var(--star);border-radius:50%;width:8px;height:8px"></i>标记</span></div>`;
  if(useGroups){
    body += Object.keys(groups).map(s=>`<div class="secblock"><h3>${s} · ${esc(SECTIONS[s-1].name)}</h3><div class="cells">${groups[s].map(cell).join("")}</div></div>`).join("");
  } else body += `<div class="cells">${L.map((id,i)=>cell([id,i])).join("")}</div>`;
  if(S.mode==="exam" && S.exam && !S.exam.done){
    const n = L.filter(id=>S.exam.ans[id]!=null).length;
    body += `<div class="btns"><button class="btn primary" id="g-submit">交卷（已答 ${n}/${L.length}）</button></div>`;
  }
  sheet("题目列表", body);
  document.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{ closeLayer(); setPos(+b.dataset.i); });
  const gs=$("#g-submit"); if(gs) gs.onclick=()=>{ closeLayer(); confirmSubmit(); };
  const cur=document.querySelector(".cell.cur"); if(cur) cur.scrollIntoView({block:"center"});
}

/* ---------- settings ---------- */
function sw(id,on){ return `<button class="switch" role="switch" id="${id}" aria-checked="${on}"></button>`; }
function seg3(name, cur, opts){ return `<div class="seg" data-set="${name}">${opts.map(([v,l])=>`<button data-v="${v}" aria-pressed="${cur===v}">${l}</button>`).join("")}</div>`; }
function openSettings(){
  const done = Object.keys(S.ans).length;
  const body = `
    <div class="row"><label>题干中文<span class="sub">“点击显示”：点一下题干才出中文，再点收起</span></label>${seg3("zhStem",S.zhStem,[["off","不显示"],["tap","点击显示"],["on","一直显示"]])}</div>
    <div class="row"><label>选项中文<span class="sub">“选中显示”：点了哪个选项，就在它下面出中文</span></label>${seg3("zhOpt",S.zhOpt,[["off","不显示"],["pick","选中显示"],["on","一直显示"]])}</div>
    <div class="row"><label>打乱题目顺序<span class="sub">练习模式下随机出题，选项本来就是打乱的</span></label>${sw("s-shuf",S.shuffleQ)}</div>
    <div class="row"><label>字号<span class="sub">手机上看不清可以调大</span></label>${seg3("fs",String(S.fs),[["0.92","小"],["1","中"],["1.12","大"]])}</div>
    <div class="row"><label>重新打乱选项<span class="sub">背答案位置不算会，换个顺序再做</span></label><button class="btn" id="s-reperm">打乱</button></div>
    <div class="row"><label>练习记录<span class="sub">已做 ${done} 题，记录只保存在这个浏览器里</span></label><button class="btn danger" id="s-reset">清空记录</button></div>
    <p style="margin:0;font-size:.78rem;color:var(--muted)">模拟考模式不显示任何中文，这两项只对练习模式生效。页码都是你手上那本 2020 版课本的页码（和 FOL 反馈一致）。</p>`;
  sheet("设置", body);
  document.querySelectorAll("[data-set]").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const k=g.dataset.set, v=b.dataset.v;
    if(k==="fs"){ S.fs=+v; applyFs(); } else S[k]=v;
    stemOpen=false; save(); render(); openSettings();
  }));
  $("#s-shuf").onclick=()=>{ S.shuffleQ=!S.shuffleQ; if(S.shuffleQ) S.order=shuffle(QUESTIONS.map(q=>q.id)); save(); render(); openSettings(); };
  $("#s-reset").onclick=()=>modal("清空练习记录？","所有作答、错题和标记都会被清除，不能恢复。","清空",()=>{ S.ans={}; S.tries={}; S.solved={}; S.marks={}; S.perm={}; S.pos={}; S.wrongSnap=[]; S.todoSnap=[]; save(); closeLayer(); render(); toast("记录已清空"); },true);
  $("#s-reperm").onclick=()=>{ S.perm={}; save(); render(); toast("选项顺序已重新打乱"); };
}
function applyFs(){ document.documentElement.style.setProperty("--fs", S.fs||1); }
$("#btn-settings").onclick=openSettings;

/* ---------- modes ---------- */
function setMode(m){
  if(m===S.mode) return;
  if(m==="exam" && !S.exam){ return openExamSetup(); }
  S.mode=m; save(); render(); scrollTop();
}
$("#m-practice").onclick=()=>setMode("practice");
$("#m-exam").onclick=()=>{ if(S.mode==="exam") openExamSetup(); else setMode("exam"); };
function openExamSetup(){
  const has = S.exam && !S.exam.done;
  const body = `<p style="margin:0;color:var(--muted)">从 ${QUESTIONS.length} 题里随机抽题，选项顺序重新打乱。做题时不显示对错，交卷后统一看成绩和解析。周一真考大约 100 题。</p>
    <div class="btns">${[30,50,100,QUESTIONS.length].map(n=>`<button class="btn ${n===QUESTIONS.length?"primary":""}" data-n="${n}">${n===QUESTIONS.length?"全部 "+n+" 题":n+" 题"}</button>`).join("")}</div>
    ${has?`<div class="row"><label>继续上次的模拟考<span class="sub">已答 ${Object.keys(S.exam.ans).length}/${S.exam.ids.length}</span></label><button class="btn" id="ex-cont">继续</button></div>`:""}
    ${S.exam && S.exam.done?`<div class="row"><label>查看上次成绩</label><button class="btn" id="ex-res">查看</button></div>`:""}`;
  sheet("模拟考", body);
  document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{
    const start=()=>{ const n=+b.dataset.n; S.exam={ids:shuffle(QUESTIONS.map(q=>q.id)).slice(0,n), ans:{}, done:false, start:Date.now(), end:null}; S.exam.ids.forEach(id=>{ if(!QUESTIONS[id].tf && !QUESTIONS[id].fx) S.perm[id]=shuffle(QUESTIONS[id].a.map((_,i)=>i)); }); S.mode="exam"; S.pos.exam=0; save(); closeLayer(); render(); scrollTop(); };
    if(has) modal("开始新的模拟考？","上次没交卷的模拟考会被放弃。","开始",start); else start();
  });
  const c=$("#ex-cont"); if(c) c.onclick=()=>{ S.mode="exam"; save(); closeLayer(); render(); };
  const r=$("#ex-res"); if(r) r.onclick=()=>{ S.mode="exam"; save(); closeLayer(); render(); showResult(); };
}
function confirmSubmit(){
  const L=S.exam.ids, n=L.filter(id=>S.exam.ans[id]!=null).length;
  modal("确认交卷？", n<L.length?`还有 <b>${L.length-n}</b> 题没答，没答的按错题算。`:"全部题目都已作答。", "交卷", ()=>{
    S.exam.done=true; S.exam.end=Date.now();
    L.forEach(id=>{ const v=S.exam.ans[id]; if(v!=null && S.ans[id]==null){ S.ans[id]=v; S.tries[id]=[v]; if(v===correctIdx(QUESTIONS[id])) S.solved[id]=true; } }); // feed practice record & wrong book
    save(); render(); showResult();
  });
}
function fmtTime(ms){ const s=Math.floor(ms/1000); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(x).padStart(2,"0"); }
function showResult(){
  const E=S.exam, L=E.ids; let ok=0;
  const per={}; L.forEach(id=>{ const q=QUESTIONS[id]; per[q.s]=per[q.s]||[0,0]; per[q.s][1]++; if(E.ans[id]===correctIdx(q)){ ok++; per[q.s][0]++; } });
  const pct=Math.round(ok/L.length*100);
  const rows=Object.keys(per).sort().map(s=>`<tr><td>${s} · ${esc(SECTIONS[s-1].name)}</td><td>${per[s][0]}/${per[s][1]}</td></tr>`).join("");
  const body=`<div class="stats"><div class="stat"><b>${pct}%</b><span>得分</span></div><div class="stat"><b>${ok}/${L.length}</b><span>答对</span></div><div class="stat"><b>${fmtTime((E.end||Date.now())-E.start)}</b><span>用时</span></div></div>
    <table class="sectbl"><thead><tr><th>分类</th><th>答对</th></tr></thead><tbody>${rows}</tbody></table>
    <p style="margin:0;color:var(--muted);font-size:.85rem">答错的题已经加入练习模式的错题本。在题目列表里点任意一题可以看解析。</p>
    <div class="btns"><button class="btn primary" id="r-review">逐题看解析</button><button class="btn" id="r-wrong">去错题本练</button><button class="btn" id="r-new">再考一次</button></div>`;
  sheet("模拟考成绩", body);
  $("#r-review").onclick=()=>{ closeLayer(); S.pos.exam=0; save(); render(); scrollTop(); };
  $("#r-wrong").onclick=()=>{ closeLayer(); S.mode="practice"; setFilter("wrong"); };
  $("#r-new").onclick=()=>{ closeLayer(); openExamSetup(); };
}

/* ---------- timer ---------- */
let tick;
function renderTimer(){
  const t=$("#timer"); clearInterval(tick);
  if(S.mode==="exam" && S.exam){ t.hidden=false; const f=()=>{ t.textContent="⏱ "+fmtTime((S.exam.end||Date.now())-S.exam.start); }; f(); if(!S.exam.done) tick=setInterval(f,1000); }
  else t.hidden=true;
}

function render(){
  $("#m-practice").setAttribute("aria-pressed", S.mode==="practice");
  $("#m-exam").setAttribute("aria-pressed", S.mode==="exam");
  if(S.mode==="exam" && !S.exam) S.mode="practice";
  renderChips(); renderQuestion(); renderProgress(); renderNav(); renderTimer();
}

/* keyboard */
document.addEventListener("keydown", e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if($("#layer").innerHTML || document.querySelector(".modal")){ if(e.key==="Escape"){ closeLayer(); const m=document.querySelector(".modal"); if(m) m.parentElement.remove(); } return; }
  const k=e.key.toLowerCase();
  if(k==="arrowright"){ e.preventDefault(); if(!$("#btn-next").disabled && $("#btn-next").dataset.act==="next") next(); return; }
  if(k==="arrowleft"){ e.preventDefault(); prev(); return; }
  if(k==="enter"||k===" "){ if(document.activeElement && document.activeElement.tagName==="BUTTON") return; if(k===" ") return; if(!$("#btn-next").disabled && $("#btn-next").dataset.act==="next") next(); return; }
  if(k==="m"){ const L=list(); if(L.length) toggleMark(L[curPos()]); return; }
  if(k==="z"){ const t=$("#qtext"); if(t && t.classList.contains("tap")) t.click(); return; }
  const btns=[...document.querySelectorAll(".opt")];
  let idx = null;
  if(btns.length===2 && (k==="t"||k==="f")) idx = k==="t"?0:1;
  else { const m={a:0,b:1,c:2,d:3,e:4,f:5,"1":0,"2":1,"3":2,"4":3,"5":4,"6":5}; if(k in m) idx=m[k]; }
  if(idx!=null){ const b=btns[idx]; if(b && !b.disabled) b.click(); }
});

applyFs();
if(S.filter==="wrong" && !S.wrongSnap) S.wrongSnap=wrongIds();
render();
})();
</script>
