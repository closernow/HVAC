<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>G2 Quiz System</title>
<style>
/* ===== VARIABLES ===== */
:root {
  --bg: #f5f3ee; --surface: #ffffff; --surface2: #fafaf8; --border: #e0ddd6;
  --text: #1a1a1a; --text-muted: #666; --text-faint: #999; --opt-bg: #fafaf8;
  --opt-hover: #f0ede6; --exp-bg: #f7f6f1; --sidebar-bg: #ffffff;
  --dot-bg: #ece9e2; --dot-text: #888; --tag-bg: #ece9e2;
  --correct-bg: #eaf5ec; --correct-border: #4caf72; --correct-text: #2a7a45;
  --wrong-bg: #fdecea; --wrong-border: #e05a5a; --wrong-text: #b33;
  --accent: #3a6ea5; --accent-bg: #e8f0f8; --warn-bg: #fffbeb;
  --warn-border: #f59e0b; --warn-text: #92400e; --progress-track: #ddd;
}
html.dark {
  --bg: #18181a; --surface: #242428; --surface2: #2a2a2f; --border: #3a3a3f;
  --text: #f0ede6; --text-muted: #999; --text-faint: #555; --opt-bg: #2a2a2f;
  --opt-hover: #32323a; --exp-bg: #1f1f24; --sidebar-bg: #1e1e22;
  --dot-bg: #2e2e34; --dot-text: #888; --tag-bg: #2e2e34;
  --correct-bg: #1a3326; --correct-border: #4caf72; --correct-text: #6dcc90;
  --wrong-bg: #3d1e1e; --wrong-border: #e05a5a; --wrong-text: #e08080;
  --accent: #5b9ad5; --accent-bg: #1e2e42; --warn-bg: #2d2000;
  --warn-border: #d97706; --warn-text: #fcd34d; --progress-track: #3a3a3f;
}

/* ===== RESET & LAYOUT ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Georgia, "Times New Roman", serif; background: var(--bg); color: var(--text); height: 100vh; height: 100dvh; overflow: hidden; display: flex; transition: background 0.3s, color 0.3s; }
.app { display: flex; width: 100%; height: 100%; }

/* ===== SIDEBAR ===== */
.sidebar { width: 260px; flex-shrink: 0; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: background 0.3s, border-color 0.3s; }
.sidebar-head { padding: 14px; border-bottom: 1px solid var(--border); background: var(--surface2); transition: background 0.3s; }
.app-title { font-size: 1rem; font-weight: normal; color: var(--accent); margin-bottom: 10px; letter-spacing: 0.01em; }
.search-box { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; font-family: Georgia, serif; background: var(--surface); color: var(--text); margin-bottom: 10px; outline: none; transition: border-color 0.2s, background 0.3s; }
.search-box:focus { border-color: var(--accent); }
.filter-tabs { display: flex; gap: 5px; margin-bottom: 10px; }
.filter-tab { flex: 1; text-align: center; padding: 5px 4px; font-size: 0.78rem; font-family: Georgia, serif; cursor: pointer; border-radius: 5px; background: var(--tag-bg); color: var(--text-muted); transition: all 0.2s; border: 1px solid transparent; }
.filter-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.source-label { font-size: 0.75rem; color: var(--text-faint); margin-bottom: 5px; }
.source-scroll { display: flex; flex-wrap: wrap; gap: 5px; max-height: 100px; overflow-y: auto; }
.source-tag { font-size: 0.72rem; padding: 3px 8px; border-radius: 10px; background: var(--tag-bg); color: var(--text-muted); cursor: pointer; border: 1px solid transparent; white-space: nowrap; }
.source-tag.active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); font-weight: bold; }
.q-list { flex: 1; overflow-y: auto; padding: 10px; }
.q-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.q-dot { aspect-ratio: 1; border-radius: 5px; background: var(--dot-bg); color: var(--dot-text); font-size: 0.78rem; font-family: Georgia, serif; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid transparent; transition: all 0.12s; position: relative; }
.q-dot.active { border-color: var(--accent); color: var(--accent); background: var(--surface); box-shadow: 0 0 0 2px var(--accent); }
.q-dot.correct { background: var(--correct-border); color: #fff; border-color: var(--correct-border); }
.q-dot.wrong { background: var(--wrong-border); color: #fff; border-color: var(--wrong-border); }
.q-dot.answered { background: var(--accent); color: #fff; border-color: var(--accent); }
.q-dot.star::after { content: "★"; position: absolute; top: -4px; right: -4px; color: #f59e0b; font-size: 9px; }
.sidebar-foot { padding: 12px 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; font-size: 0.82rem; color: var(--text-muted); background: var(--surface2); }
.foot-row { display: flex; justify-content: space-between; align-items: center; }
.reset-link { color: var(--accent); cursor: pointer; font-size: 0.78rem; }
.foot-btn { width: 100%; padding: 7px; font-size: 0.8rem; font-family: Georgia, serif; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.foot-btn.green { background: #059669; color: #fff; border-color: #059669; }

/* ===== MAIN AREA ===== */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.toolbar { height: 54px; padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.toolbar-left { display: flex; align-items: center; gap: 14px; }
.q-counter { font-size: 1rem; color: var(--text); }
.q-counter span { color: var(--accent); }
.progress-mini { width: 120px; height: 4px; background: var(--progress-track); border-radius: 99px; overflow: hidden; }
.progress-mini-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s; }
.toolbar-right { display: flex; align-items: center; gap: 14px; }
.timer-badge { display: none; background: var(--warn-bg); color: var(--warn-text); padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; border: 1px solid var(--warn-border); }
.exam-toggle-wrap { display: flex; align-items: center; gap: 7px; font-size: 0.82rem; color: var(--text-muted); cursor: pointer; }
.toggle-track { position: relative; width: 36px; height: 20px; background: var(--progress-track); border-radius: 99px; transition: background 0.3s; }
.toggle-track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: transform 0.3s; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
.toggle-input { display: none; }
.toggle-input:checked + .toggle-track { background: var(--accent); }
.toggle-input:checked + .toggle-track::after { transform: translateX(16px); }
.theme-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; padding: 0 4px; display: flex; align-items: center; }
.nav-btn.submit { background: #d97706; color: #fff; border-color: #d97706; display: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: Georgia, serif; font-size: 0.82rem; border-width: 1px; border-style: solid;}

/* ===== CONTENT ===== */
.content-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 24px; display: flex; justify-content: center; align-items: flex-start; padding-bottom: 40px; }
.card-wrapper { position: relative; width: 100%; max-width: 820px; }
.card { width: 100%; padding-bottom: 20px; will-change: transform, opacity; }
#phantomCard { position: absolute; top: 0; left: 0; z-index: 1; display: none; pointer-events: none; }
#questionCard { position: relative; z-index: 2; }

.unit-badge { display: inline-block; font-size: 0.75rem; font-weight: bold; font-family: -apple-system, sans-serif; text-transform: uppercase; color: var(--accent); background: var(--accent-bg); padding: 3px 10px; border-radius: 4px; margin-bottom: 14px; border: 1px solid var(--accent); }
.q-text { font-size: 1.1rem; font-weight: bold; line-height: 1.6; margin-bottom: 4px; color: var(--text); }
.q-trans { display: none; font-size: 0.88rem; color: var(--text-muted); margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border); line-height: 1.5; }

.hint-wrap { display: none !important; }

.opt-list { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.opt-btn { display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--opt-bg); cursor: pointer; font-size: 0.95rem; font-family: Georgia, serif; color: var(--text); text-align: left; transition: background 0.12s, border-color 0.12s; line-height: 1.5; }
.opt-btn:hover { border-color: var(--accent); background: var(--opt-hover); }
.opt-key { font-weight: bold; color: var(--text-faint); min-width: 20px; font-size: 0.85rem; padding-top: 1px; }
.opt-trans { display: none; font-size: 0.82rem; color: var(--text-muted); margin-top: 3px; }
.opt-btn.highlight-correct { background: var(--correct-bg); border-color: var(--correct-border); }
.opt-btn.highlight-correct .opt-key { color: var(--correct-text); }
.opt-btn.highlight-wrong { background: var(--wrong-bg); border-color: var(--wrong-border); }
.opt-btn.highlight-wrong .opt-key { color: var(--wrong-text); }
.opt-btn.exam-selected { border-color: var(--accent); background: var(--accent-bg); }

/* ===== FEEDBACK ===== */
.feedback { display: none; margin-top: 22px; padding: 18px 20px; border-radius: 8px; font-size: 0.9rem; line-height: 1.6; }
.feedback.ok { background: var(--correct-bg); border: 1px solid var(--correct-border); color: var(--correct-text); }
.feedback.bad { background: var(--wrong-bg); border: 1px solid var(--wrong-border); color: var(--wrong-text); }
.fb-title { font-weight: bold; display: block; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed rgba(0,0,0,0.15); }
.fb-exp { white-space: pre-wrap; line-height: 1.65; margin-top: 5px; color: var(--text); font-size: 0.88rem; }
.feedback.ok .fb-msg, .feedback.ok .fb-exp, .feedback.ok .fb-section-label { color: var(--correct-text); }
.feedback.bad .fb-msg, .feedback.bad .fb-exp, .feedback.bad .fb-section-label { color: var(--wrong-text); }
.feedback.ok .fb-src, .feedback.bad .fb-src { color: var(--text-muted); }
.fb-msg { margin-bottom: 10px; color: var(--text); font-size: 0.9rem; line-height: 1.5; }
.fb-section-label { font-weight: bold; font-size: 0.88rem; color: var(--text); margin-bottom: 4px; display: inline-block; }
.fb-src { white-space: pre-wrap; line-height: 1.8; font-style: italic; font-size: 0.82rem; color: var(--text-muted); padding: 8px 0; margin-top: 5px; }
.fb-divider { border: none; border-top: 1px dashed var(--border); margin: 10px 0; }
.fb-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.edit-btn { font-size: 0.78rem; padding: 2px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); cursor: pointer; font-family: Georgia, serif; }
.edit-btn:hover { background: var(--opt-hover); }
.src-textarea { width: 100%; height: 120px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-family: Georgia, serif; font-size: 0.85rem; line-height: 1.5; background: var(--surface); color: var(--text); resize: vertical; margin-top: 8px; transition: background 0.3s, color 0.3s; }
.save-row { display: flex; gap: 8px; margin-top: 6px; }
.save-row button { padding: 4px 14px; border-radius: 5px; cursor: pointer; font-family: Georgia, serif; font-size: 0.82rem; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.save-row button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.edit-warn { font-size: 0.75rem; color: var(--warn-text); margin-top: 5px; }

/* ===== BOTTOM NAV ===== */
.bottom-nav { width: 100%; height: 62px; flex-shrink: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 24px; transition: background 0.3s, border-color 0.3s; }
.nav-btn { padding: 9px 20px; border-radius: 7px; font-family: Georgia, serif; font-size: 0.88rem; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.nav-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 8px; z-index: 9999; font-size: 1rem; pointer-events: none; opacity: 0; transition: opacity 0.3s ease; text-align: center; }
.toast.show { opacity: 1; }
.empty-state { display: none; text-align: center; padding: 60px 20px; }

/* ===== OVERLAY ===== */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 200; display: none; align-items: center; justify-content: center; }
.result-card { background: var(--surface); border-radius: 14px; padding: 32px 28px; text-align: center; width: 90%; max-width: 380px; box-shadow: 0 16px 40px rgba(0,0,0,0.2); }
.result-score { font-size: 4rem; font-weight: bold; color: var(--accent); margin: 4px 0 16px; line-height: 1; }
.result-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.result-stat { background: var(--surface2); border-radius: 8px; padding: 10px; }
.result-stat-val { font-size: 1.3rem; font-weight: bold; display: block; }
.result-stat-lbl { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
.result-btns { display: flex; gap: 12px; justify-content: center; }
.result-btn { padding: 8px 18px; border-radius: 7px; cursor: pointer; font-family: Georgia, serif; font-size: 0.88rem; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.result-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

.hl { background: #fef08a; color: #854d0e; border-bottom: 2px solid #eab308; padding: 0 2px; border-radius: 2px; font-weight: bold; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

/* ===== SIDEBAR OVERLAY ===== */
.hamburger { display: none; background: none; border: none; font-size: 1.3rem; cursor: pointer; padding: 0 4px; color: var(--text); line-height: 1; }
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50; }
.sidebar-overlay.show { display: block; }

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) { .sidebar { width: 220px; } }
@media (max-width: 650px) {
  .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 80vw; max-width: 300px; z-index: 60; transform: translateX(-100%); transition: transform 0.28s ease; box-shadow: 4px 0 20px rgba(0,0,0,0.15); }
  .sidebar.open { transform: translateX(0); }
  .hamburger { display: block; }
  .bottom-nav { display: none !important; }
  .content-scroll { padding: 16px 12px 140px 12px; }
  .toolbar { padding: 0 10px; height: 50px; }
  .toolbar-left { gap: 8px; } .toolbar-right { gap: 6px; }
  .progress-mini { width: 60px; } .q-text { font-size: 1rem; } .opt-btn { font-size: 0.9rem; padding: 11px 13px; }
  .result-card { width: 92%; padding: 24px 18px; } .result-score { font-size: 3rem; }
}
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="app">

  <div class="sidebar">
    <div class="sidebar-head">
      <div class="app-title">G2 Quiz System</div>
      <input type="text" class="search-box" id="searchBox" placeholder="Search questions..." oninput="handleSearch()">
      <div class="filter-tabs">
        <div class="filter-tab active" id="tab-all" onclick="setFilter('all')">All</div>
        <div class="filter-tab" id="tab-wrong" onclick="setFilter('wrong')">Wrong</div>
        <div class="filter-tab" id="tab-star" onclick="setFilter('star')">Starred</div>
      </div>
      <div class="source-label">Chapter filter:</div>
      <div class="source-scroll" id="sourceList"></div>
    </div>
    <div class="q-list"><div class="q-grid" id="qGrid"></div></div>
    <div class="sidebar-foot">
      <div class="foot-row"><span id="totalStats">Done: 0 / 0</span><span class="reset-link" onclick="resetProgress()">Clear progress</span></div>
      <button class="foot-btn" onclick="shuffleQuestions()">Shuffle questions &amp; options</button>
      <button class="foot-btn green" onclick="exportHtml()">Save updated file</button>
    </div>
  </div>

  <div class="main">
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="hamburger" id="hamburger" onclick="toggleSidebar()">&#9776;</button>
        <div class="q-counter">Q <span id="currNum">1</span> / <span id="totalNum">1</span></div>
        <div class="progress-mini"><div class="progress-mini-fill" id="miniBar" style="width:0%"></div></div>
      </div>
      <div class="toolbar-right">
        <div class="timer-badge" id="timerBadge">03:30:00</div>
        <button id="topSubmitBtn" class="nav-btn submit" onclick="submitExam()">Submit</button>
        <label class="exam-toggle-wrap">
          <input type="checkbox" class="toggle-input" id="cnToggle" onchange="toggleChinese()">
          <div class="toggle-track"></div><span id="cnLabel">EN</span>
        </label>
        <label class="exam-toggle-wrap">
          <input type="checkbox" class="toggle-input" id="examToggle" onchange="toggleExam()">
          <div class="toggle-track"></div><span>Exam</span>
        </label>
        <button class="theme-btn" id="favBtn" onclick="toggleStar()" style="font-size:1.3rem;">☆</button>
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
      </div>
    </div>

    <div class="content-scroll">
      <div class="card-wrapper">
        <div class="card" id="phantomCard"></div>
        <div class="card" id="questionCard">
          <div id="unitBadge" class="unit-badge"></div>
          <div class="q-text" id="qText"></div>
          <div class="q-trans" id="qTrans"></div>
          <div class="hint-wrap" id="hintWrap"></div>
          <div class="opt-list" id="optList"></div>
          <div class="feedback" id="feedbackBox"></div>
          <div class="empty-state" id="emptyState">
            <h3>No questions in this view</h3><p>Try changing the filter or search term.</p>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-nav" id="bottomNav">
      <button class="nav-btn" onclick="prevQ()">Prev</button>
      <button class="nav-btn primary" onclick="nextQ()">Next</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="result-card">
    <div class="result-title">Exam result</div>
    <div class="result-score" id="resScore">0</div>
    <div class="result-grid">
      <div class="result-stat"><span class="result-stat-val" id="resTotal">0</span><span class="result-stat-lbl">Total</span></div>
      <div class="result-stat"><span class="result-stat-val" style="color:var(--correct-text)" id="resRight">0</span><span class="result-stat-lbl">Correct</span></div>
      <div class="result-stat"><span class="result-stat-val" style="color:var(--wrong-text)" id="resWrong">0</span><span class="result-stat-lbl">Wrong</span></div>
    </div>
    <div class="result-btns">
      <button class="result-btn" onclick="closeResult()">Review answers</button>
      <button class="result-btn primary" onclick="resetProgress()">Restart</button>
    </div>
  </div>
</div>

<script>
/* ==========================================================
   QUIZ DATA (在这里贴上你的所有题目代码)
========================================================== */
var quizData = [
  {
    "u": "Chapter 1: Code requirements and approved joining methods",
    "q": "Indicate true or false: A pressure test is performed after the appliance is installed.@@(判断对错：压力测试是在器具安装之后进行的。)",
    "hint": "Check the sequence of testing operations.",
    "opts": [
        {
            "t": "True@@(正确)",
            "f": "错误。泄漏测试才是在安装后进行的。"
        },
        {
            "t": "False@@(错误)",
            "f": "正确。压力测试必须在安装任何器具之前进行。"
        }
    ],
    "a": 1,
    "exp": "解析: 系统的压力测试(Pressure test)必须在连接任何器具之前进行。而在器具安装之后进行的是泄漏测试(Leak test)。",
    "src": "• 课文出处: Page 11。\n• 原文语句: \"Pressure test: Before any appliances are installed. Leak test: After appliances are installed.\""
},
{
    "u": "Chapter 1: Code requirements and approved joining methods",
    "q": "Before the appliances are connected, the system shall be pressure tested using...@@(在连接器具之前，系统应使用什么进行压力测试？)",
    "hint": "Consider safe testing mediums.",
    "opts": [
        {
            "t": "Air or inert gas@@(空气或惰性气体)",
            "f": "正确。符合规范安全要求。"
        },
        {
            "t": "Air or soap solution@@(空气或肥皂液)",
            "f": "错误。肥皂液用于查找泄漏点，不用于给系统加压。"
        },
        {
            "t": "Inert gas or soap solution@@(惰性气体或肥皂液)",
            "f": "错误。肥皂液不能用于加压。"
        }
    ],
    "a": 0,
    "exp": "解析: 在测试前，必须使用空气或惰性气体（如氮气或二氧化碳）将系统加压到指定的测试压力，以确保安全。",
    "src": "• 课文出处: Page 11。\n• 原文语句: \"Pressurize the system with air or inert gas (nitrogen or carbon dioxide) to the specified test pressure...\""
},
{
    "u": "Chapter 1: Code requirements and approved joining methods",
    "q": "When would you perform a soap test?@@(你会在什么时候进行肥皂测试？)",
    "hint": "Soap is used for pinpointing something specific.",
    "opts": [
        {
            "t": "After every service call@@(每次维修服务之后)",
            "f": "错误。这不是常规必须操作。"
        },

/* ==========================================================
   STATE
========================================================== */
var SAVE_KEY = 'g2_quiz_v1';
var EDIT_KEY = 'g2_quiz_edits_v1';
var timerInterval = null;
var timeRemaining = 3.5 * 3600;
var windowSlideDirection = ''; 

var state = { masterList: [], list: [], optionMaps: {}, pointer: 0, records: {}, filter: 'all', source: 'all', search: '', isExam: false, examSubmitted: false, shuffled: false, showChinese: false };

/* ==========================================================
   THEME & HIGHLIGHT
========================================================== */
function toggleTheme() { var dark = document.documentElement.classList.toggle('dark'); localStorage.setItem('g2_theme', dark ? 'dark' : 'light'); document.getElementById('themeBtn').textContent = dark ? '☀️' : '🌙'; }
function initTheme() { var saved = localStorage.getItem('g2_theme'); var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches; var useDark = saved ? saved === 'dark' : sysDark; if (useDark) document.documentElement.classList.add('dark'); document.getElementById('themeBtn').textContent = useDark ? '☀️' : '🌙'; }
function hl(text) { if (!state.search || !text) return text; var kw = state.search.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); return text.replace(new RegExp('(' + kw + ')(?![^<]*>)', 'gi'), '<span class="hl">$1</span>'); }

/* ==========================================================
   INIT & TABS
========================================================== */
function init() {
  initTheme(); initChinese(); if (!quizData || quizData.length === 0) return;
  try { var em = JSON.parse(localStorage.getItem(EDIT_KEY)); if (em) Object.keys(em).forEach(function(i) { if (quizData[i]) quizData[i].src = em[i]; }); } catch(e) {}
  state.masterList = quizData.map(function(_, i) { return i; }); loadProgress();
  if (state.list.length === 0) state.list = state.masterList.slice();
  document.getElementById('totalNum').textContent = quizData.length;
  renderSourceTabs(); applyFilter(); document.addEventListener('keydown', handleKey);
}
function renderSourceTabs() {
  var container = document.getElementById('sourceList'); container.innerHTML = ''; var sources = {};
  quizData.forEach(function(q) { sources[q.u || 'Uncategorized'] = true; });
  function makeTag(label, value) { var el = document.createElement('div'); el.className = 'source-tag' + (state.source === value ? ' active' : ''); el.textContent = label; el.onclick = function() { setSource(value); }; container.appendChild(el); }
  makeTag('All', 'all'); Object.keys(sources).sort().forEach(function(s) { makeTag(s, s); });
}
function setSource(src) { state.source = src; renderSourceTabs(); applyFilter(); }
function setFilter(type) { state.filter = type; ['all','wrong','star'].forEach(function(t) { document.getElementById('tab-' + t).classList.toggle('active', t === type); }); applyFilter(); }
function handleSearch() { state.search = document.getElementById('searchBox').value.toLowerCase(); applyFilter(); }
function applyFilter() {
  state.list = state.masterList.filter(function(id) {
    var q = quizData[id], rec = state.records[id], src = q.u || 'Uncategorized';
    if (state.source !== 'all' && src !== state.source) return false;
    if (state.search) { var full = (q.q || '') + (q.exp || '') + (q.src || ''); if (q.opts) full += q.opts.map(function(o){ return o.t; }).join(''); if (!full.toLowerCase().includes(state.search)) return false; }
    if (state.filter === 'wrong') return rec && rec.status === 'wrong';
    if (state.filter === 'star') return rec && rec.marked; return true;
  });
  state.pointer = 0; windowSlideDirection = ''; 
  document.querySelector('.content-scroll').scrollTop = 0; // 切换过滤条件时回顶
  renderSidebar(); renderQuestion();
}
function shuffleQuestions() {
  if (state.masterList.length < 2) return;
  for (var i = state.masterList.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var tmp = state.masterList[i]; state.masterList[i] = state.masterList[j]; state.masterList[j] = tmp; }
  state.optionMaps = {};
  state.masterList.forEach(function(id) {
    var count = quizData[id].opts.length; var arr = Array.from({length: count}, function(_, i) { return i; });
    for (var i = count - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp; }
    state.optionMaps[id] = arr;
  });
  state.shuffled = true; applyFilter();
}

/* ==========================================================
   RENDER CORE
========================================================== */
function renderSidebar() {
  var grid = document.getElementById('qGrid'); grid.innerHTML = '';
  state.list.forEach(function(id, idx) {
    var dot = document.createElement('div'); dot.className = 'q-dot'; dot.textContent = id + 1;
    var rec = state.records[id];
    if (rec) {
      if (rec.marked) dot.classList.add('star');
      if (state.isExam && !state.examSubmitted) { if (rec.userChoice !== undefined) dot.classList.add('answered'); } 
      else { if (rec.status === 'correct') dot.classList.add('correct'); if (rec.status === 'wrong') dot.classList.add('wrong'); }
    }
    if (idx === state.pointer) dot.classList.add('active');
    dot.onclick = function() { 
      state.pointer = idx; windowSlideDirection = ''; 
      document.querySelector('.content-scroll').scrollTop = 0; // 点击侧边栏题号时回顶
      renderQuestion(); 
    }; 
    grid.appendChild(dot);
  });
  var done = Object.keys(state.records).filter(function(k) { return state.records[k].userChoice !== undefined; }).length;
  document.getElementById('totalStats').textContent = 'Done: ' + done + ' / ' + quizData.length;
  document.getElementById('miniBar').style.width = (state.list.length ? Math.round((state.pointer + 1) / state.list.length * 100) : 0) + '%';
}

function renderQuestion() {
  var card = document.getElementById('questionCard');
  var empty = document.getElementById('emptyState');
  var optList = document.getElementById('optList');
  var fb = document.getElementById('feedbackBox');

  if (state.list.length === 0) { card.style.display = 'none'; empty.style.display = 'block'; return; }
  card.style.display = 'block'; empty.style.display = 'none';

  if (windowSlideDirection === 'swipe_snap') {
    card.style.transition = 'none';
    card.style.transform = 'translateX(0)';
    card.style.opacity = '1';
  } else if (windowSlideDirection === 'left') {
    card.style.transition = 'none'; card.style.transform = 'translateX(60vw)'; card.style.opacity = '0';
    void card.offsetWidth;
    card.style.transition = 'transform 0.25s ease-out, opacity 0.25s ease';
    card.style.transform = 'translateX(0)'; card.style.opacity = '1';
  } else if (windowSlideDirection === 'right') {
    card.style.transition = 'none'; card.style.transform = 'translateX(-60vw)'; card.style.opacity = '0';
    void card.offsetWidth;
    card.style.transition = 'transform 0.25s ease-out, opacity 0.25s ease';
    card.style.transform = 'translateX(0)'; card.style.opacity = '1';
  } else {
    card.style.transition = 'none'; card.style.transform = 'translateX(0)'; card.style.opacity = '1';
  }
  windowSlideDirection = ''; 

  var id = state.list[state.pointer]; var q = quizData[id]; var rec = state.records[id] || {};
  document.getElementById('currNum').textContent = state.pointer + 1; document.getElementById('totalNum').textContent = state.list.length;
  document.getElementById('unitBadge').textContent = q.u || 'Question';

  var parts = (q.q || '').split('@@');
  document.getElementById('qText').innerHTML = hl(parts[0] || '');
  document.getElementById('qTrans').innerHTML = hl(parts[1] || ''); document.getElementById('qTrans').style.display = state.showChinese ? 'block' : 'none';

  var favBtn = document.getElementById('favBtn'); favBtn.textContent = rec.marked ? '⭐' : '☆'; favBtn.style.color = rec.marked ? '#f59e0b' : 'var(--text-muted)';

  var labels = ['A','B','C','D','E'];
  var order = (state.shuffled && state.optionMaps[id]) ? state.optionMaps[id] : q.opts.map(function(_, i){ return i; });
  optList.innerHTML = '';
  
  order.forEach(function(origIdx, visIdx) {
    var opt = q.opts[origIdx]; var optParts = (opt.t || '').split('@@');
    var extraClass = '';
    if (rec.userChoice === origIdx && !state.isExam) { extraClass = (origIdx === q.a) ? 'highlight-correct' : 'highlight-wrong'; } 
    else if (state.isExam && rec.userChoice === origIdx) { extraClass = 'exam-selected'; }

    var transVisible = state.showChinese && optParts[1] ? 'block' : 'none';
    var btn = document.createElement('div'); btn.className = 'opt-btn ' + extraClass;
    btn.innerHTML = '<span class="opt-key">' + labels[visIdx] + '</span>' +
      '<div><div>' + hl(optParts[0]) + '</div><div class="opt-trans" style="display:' + transVisible + ';">' + hl(optParts[1]||'') + '</div></div>';
    btn.onclick = function() { handleAnswer(id, origIdx); }; optList.appendChild(btn);
  });

  if (rec.userChoice !== undefined && !state.isExam) { showFeedback(id, rec.userChoice); } 
  else { fb.style.display = 'none'; fb.innerHTML = ''; }
  renderSidebar(); saveProgress();
}

function handleAnswer(id, origIdx) {
  var q = quizData[id]; var isRight = origIdx === q.a; var oldMarked = state.records[id] ? state.records[id].marked : false;
  if (state.isExam && !state.examSubmitted) {
    if (!state.records[id]) state.records[id] = {}; state.records[id].userChoice = origIdx; state.records[id].status = 'answered'; renderQuestion(); return;
  }
  state.records[id] = { status: isRight ? 'correct' : 'wrong', userChoice: origIdx, marked: oldMarked }; saveProgress(); renderQuestion(); 
}

/* ==========================================================
   FEEDBACK
========================================================== */
function showFeedback(id, choiceIdx) {
  var q = quizData[id];
  var isRight = choiceIdx === q.a;
  var fb = document.getElementById('feedbackBox');
  fb.className = 'feedback ' + (isRight ? 'ok' : 'bad');
  fb.style.display = 'block';

  var fText = (q.opts[choiceIdx].f || '').replace(/^[✅❌⚠️]+\s*/, '');

  var html = '<span class="fb-title">' + (isRight ? '✅ Correct' : '❌ Incorrect') + '</span>';
  html += '<div class="fb-msg">' + hl(fText) + '</div>';
  html += '<hr class="fb-divider">';
  html += '<div class="fb-section-label">Explanation</div>';
  html += '<div class="fb-exp">' + hl(q.exp || '(no explanation)') + '</div>';

  if (q.src !== undefined) {
    html += '<hr class="fb-divider">';
    html += '<div class="fb-row">';
    html += '  <span class="fb-section-label">Source</span>';
    html += '  <button class="edit-btn" onclick="enableEdit(' + id + ')">✏️ Edit</button>';
    html += '</div>';
    html += '<div class="fb-src" id="src-display-' + id + '">' + hl(q.src || '') + '</div>';
    html += '<div id="editor-area-' + id + '" style="display:none;">';
    html += '  <textarea class="src-textarea" id="src-input-' + id + '">' + (q.src || '') + '</textarea>';
    html += '  <div class="save-row">';
    html += '    <button class="primary" onclick="saveEdit(' + id + ', this)">Save</button>';
    html += '    <button onclick="cancelEdit(' + id + ')">Cancel</button>';
    html += '  </div>';
    html += '  <div class="edit-warn">⚠️ Saved to browser. Use "Save updated file" in sidebar to persist.</div>';
    html += '</div>';
  }

  fb.innerHTML = html;
}

function enableEdit(id) { document.getElementById('src-display-' + id).style.display = 'none'; var ea = document.getElementById('editor-area-' + id); ea.style.display = 'block'; var ta = document.getElementById('src-input-' + id); ta.value = quizData[id].src || ''; ta.focus(); }
function cancelEdit(id) { document.getElementById('src-display-' + id).style.display = 'block'; document.getElementById('editor-area-' + id).style.display = 'none'; }
function saveEdit(id, btn) {
  var newSrc = document.getElementById('src-input-' + id).value; quizData[id].src = newSrc;
  document.getElementById('src-display-' + id).textContent = newSrc; cancelEdit(id);
  var edits = {}; try { edits = JSON.parse(localStorage.getItem(EDIT_KEY) || '{}'); } catch(e) {}
  edits[id] = newSrc; localStorage.setItem(EDIT_KEY, JSON.stringify(edits));
  if (btn) { var orig = btn.textContent; btn.textContent = 'Saved!'; btn.style.background = '#059669'; btn.style.color = 'white'; setTimeout(function() { btn.textContent = orig; btn.style.background = ''; btn.style.color = ''; }, 1200); }
}

/* ==========================================================
   INTERACTIONS & UTILS
========================================================== */
function nextQ() { 
  if (state.pointer < state.list.length - 1) { 
    if (windowSlideDirection !== 'swipe_snap') windowSlideDirection = 'left'; 
    state.pointer++; 
    document.querySelector('.content-scroll').scrollTop = 0; // 切下一题时强制回顶
    renderQuestion(); 
  } 
}
function prevQ() { 
  if (state.pointer > 0) { 
    if (windowSlideDirection !== 'swipe_snap') windowSlideDirection = 'right'; 
    state.pointer--; 
    document.querySelector('.content-scroll').scrollTop = 0; // 切上一题时强制回顶
    renderQuestion(); 
  } 
}
function toggleStar() {
  var id = state.list[state.pointer]; if (id === undefined) return;
  if (!state.records[id]) state.records[id] = {}; var isNowMarked = !state.records[id].marked; state.records[id].marked = isNowMarked;
  if (state.filter === 'star' && !isNowMarked) { state.list.splice(state.pointer, 1); if (state.pointer >= state.list.length) state.pointer = Math.max(0, state.list.length - 1); }
  renderQuestion(); saveProgress(); showToast(isNowMarked ? '⭐ Starred' : 'Removed from Starred');
}
function showToast(msg) {
  var t = document.getElementById('toastMsg'); if (!t) { t = document.createElement('div'); t.id = 'toastMsg'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); }, 1500);
}
function toggleChinese() { state.showChinese = document.getElementById('cnToggle').checked; document.getElementById('cnLabel').textContent = state.showChinese ? 'CN' : 'EN'; localStorage.setItem('g2_cn', state.showChinese ? '1' : '0'); renderQuestion(); }
function initChinese() { if (localStorage.getItem('g2_cn') === '1') { state.showChinese = true; document.getElementById('cnToggle').checked = true; document.getElementById('cnLabel').textContent = 'CN'; } }
function saveProgress() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ records: state.records, pointer: state.pointer, filter: state.filter, source: state.source })); } catch(e) {} }
function loadProgress() { try { var s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) { state.records = s.records||{}; state.pointer = s.pointer||0; state.filter = s.filter||'all'; state.source = s.source||'all'; } } catch(e) {} }

/* ===== 新增的防误触、防拦截双击清除功能 ===== */
var resetTimer = null;
function resetProgress() { 
  var link = document.querySelector('.reset-link');
  var bBtn = document.querySelector('.result-btn.primary');
  
  if (!resetTimer) {
    showToast("⚠️ Tap again to confirm"); 
    if (link) { link.textContent = 'Sure to clear?'; link.style.color = '#e05a5a'; }
    if (bBtn) { bBtn.textContent = 'Sure to Restart?'; bBtn.style.background = '#e05a5a'; bBtn.style.borderColor = '#e05a5a'; }
    resetTimer = setTimeout(function() {
      resetTimer = null;
      if (link) { link.textContent = 'Clear progress'; link.style.color = ''; }
      if (bBtn) { bBtn.textContent = 'Restart'; bBtn.style.background = ''; bBtn.style.borderColor = ''; }
    }, 3000);
    return;
  }
  if (resetTimer) { clearTimeout(resetTimer); resetTimer = null; }
  if (link) { link.textContent = 'Clear progress'; link.style.color = ''; }
  if (bBtn) { bBtn.textContent = 'Restart'; bBtn.style.background = ''; bBtn.style.borderColor = ''; }

  localStorage.removeItem(SAVE_KEY); 
  state.records = {}; state.pointer = 0; state.filter = 'all'; state.source = 'all'; 
  if (state.isExam) toggleExam(); 
  ['all','wrong','star'].forEach(function(t) { document.getElementById('tab-' + t).classList.toggle('active', t === 'all'); }); 
  renderSourceTabs(); windowSlideDirection = 'swipe_snap'; applyFilter(); 
  showToast("✅ Progress cleared!"); 
}
/* ======================================= */

function toggleSidebar() { var sb = document.querySelector('.sidebar'); var ov = document.getElementById('sidebarOverlay'); var open = sb.classList.toggle('open'); ov.classList.toggle('show', open); }
function closeSidebar() { document.querySelector('.sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('show'); }

/* ==========================================================
   EXAM MODE
========================================================== */
function toggleExam() {
  if (document.getElementById('examToggle').checked) {
    if (!confirm('Enable exam mode?\n- Answers hidden until submission\n- Timer starts\n- Submit when done')) { document.getElementById('examToggle').checked = false; return; }
    state.isExam = true; state.examSubmitted = false; document.getElementById('timerBadge').style.display = 'block'; document.getElementById('topSubmitBtn').style.display = 'inline-block'; startTimer();
  } else {
    state.isExam = false; state.examSubmitted = false; clearInterval(timerInterval); document.getElementById('timerBadge').style.display = 'none'; document.getElementById('topSubmitBtn').style.display = 'none';
  }
  windowSlideDirection = ''; 
  document.querySelector('.content-scroll').scrollTop = 0; // 切换模式回顶
  renderQuestion(); saveProgress();
}
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(function() {
    timeRemaining--; if (timeRemaining <= 0) { clearInterval(timerInterval); submitExam(); return; }
    var h = Math.floor(timeRemaining / 3600), m = Math.floor((timeRemaining % 3600) / 60), s = timeRemaining % 60;
    document.getElementById('timerBadge').textContent = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }, 1000);
}
function submitExam() {
  state.examSubmitted = true; clearInterval(timerInterval); var correct = 0, wrong = 0;
  quizData.forEach(function(q, i) { var rec = state.records[i]; if (rec && rec.userChoice !== undefined) { if (rec.userChoice === q.a) { correct++; rec.status = 'correct'; } else { wrong++; rec.status = 'wrong'; } } });
  document.getElementById('resScore').textContent = Math.round(correct / quizData.length * 100) + '%'; document.getElementById('resTotal').textContent = quizData.length; document.getElementById('resRight').textContent = correct; document.getElementById('resWrong').textContent = wrong;
  document.getElementById('overlay').style.display = 'flex'; document.getElementById('topSubmitBtn').style.display = 'none'; renderSidebar(); saveProgress();
}
function closeResult() { document.getElementById('overlay').style.display = 'none'; state.isExam = false; document.getElementById('examToggle').checked = false; document.getElementById('timerBadge').style.display = 'none'; windowSlideDirection = ''; renderQuestion(); }

/* ==========================================================
   PHANTOM RENDERER (带有解析满血状态的幻影卡片预加载)
========================================================== */
function renderPhantomCard(targetIdx) {
  if(targetIdx < 0 || targetIdx >= state.list.length) return false;
  var id = state.list[targetIdx]; var q = quizData[id]; var rec = state.records[id] || {};
  
  var html = '<div class="unit-badge">' + (q.u || 'Question') + '</div>';
  var parts = (q.q || '').split('@@');
  html += '<div class="q-text">' + hl(parts[0]) + '</div>';
  if(state.showChinese && parts[1]) { html += '<div class="q-trans" style="display:block;">' + hl(parts[1]) + '</div>'; }
  
  html += '<div class="opt-list">';
  var labels = ['A','B','C','D','E'];
  var order = (state.shuffled && state.optionMaps[id]) ? state.optionMaps[id] : q.opts.map(function(_, i){ return i; });
  
  order.forEach(function(origIdx, visIdx) {
    var opt = q.opts[origIdx]; var optParts = (opt.t || '').split('@@');
    var extraClass = '';
    if (rec.userChoice === origIdx && !state.isExam) { extraClass = (origIdx === q.a) ? 'highlight-correct' : 'highlight-wrong'; } 
    else if (state.isExam && rec.userChoice === origIdx) { extraClass = 'exam-selected'; }
    
    html += '<div class="opt-btn ' + extraClass + '"><span class="opt-key">' + labels[visIdx] + '</span>';
    html += '<div><div>' + hl(optParts[0]) + '</div>';
    if(state.showChinese && optParts[1]) { html += '<div class="opt-trans" style="display:block;">' + hl(optParts[1]) + '</div>'; }
    html += '</div></div>';
  });
  html += '</div>';
  
  // 🌟【修复点】把解析和错题记录也加进幻影卡片了
  if (rec.userChoice !== undefined && !state.isExam) {
    var choiceIdx = rec.userChoice;
    var isRight = choiceIdx === q.a;
    var fText = (q.opts[choiceIdx].f || '').replace(/^[✅❌⚠️]+\s*/, '');

    html += '<div class="feedback ' + (isRight ? 'ok' : 'bad') + '" style="display:block;">';
    html += '<span class="fb-title">' + (isRight ? '✅ Correct' : '❌ Incorrect') + '</span>';
    html += '<div class="fb-msg">' + hl(fText) + '</div>';
    html += '<hr class="fb-divider">';
    html += '<div class="fb-section-label">Explanation</div>';
    html += '<div class="fb-exp">' + hl(q.exp || '(no explanation)') + '</div>';

    if (q.src !== undefined) {
      html += '<hr class="fb-divider">';
      html += '<div class="fb-row">';
      html += '  <span class="fb-section-label">Source</span>';
      html += '</div>';
      html += '<div class="fb-src">' + hl(q.src || '') + '</div>';
    }
    html += '</div>';
  }
  
  var pc = document.getElementById('phantomCard');
  pc.innerHTML = html; pc.style.display = 'block'; return true;
}

/* ==========================================================
   TOUCH TRACKING 
========================================================== */
var touchStartX = 0, touchStartY = 0;
var currentDx = 0;
var longPressTimer = null;
var isLongPress = false;
var isDragging = false;
var isSwiping = false; 
var phantomLoadedFor = -1;

var scrollArea = document.querySelector('.content-scroll');
var qCard = document.getElementById('questionCard');
var pCard = document.getElementById('phantomCard');

scrollArea.addEventListener('touchstart', function(e) {
  if (e.touches.length > 1) return; 
  touchStartX = e.touches[0].screenX; touchStartY = e.touches[0].screenY;
  isLongPress = false; isDragging = true; isSwiping = false; currentDx = 0;
  qCard.style.transition = 'none'; pCard.style.transition = 'none';

  var tag = e.target.tagName;
  if (tag === 'BUTTON' || tag === 'INPUT' || tag === 'TEXTAREA' || e.target.closest('.opt-btn') || e.target.closest('.search-box')) return; 

  longPressTimer = setTimeout(function() {
    if (!isSwiping) { isLongPress = true; toggleStar(); if('vibrate' in navigator) navigator.vibrate(40); }
  }, 600);
}, {passive: true});

scrollArea.addEventListener('touchmove', function(e) {
  if (!isDragging) return;
  var dx = e.touches[0].screenX - touchStartX;
  var dy = e.touches[0].screenY - touchStartY;

  if (!isSwiping) {
    if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 10) { isDragging = false; if (longPressTimer) clearTimeout(longPressTimer); return; } 
    else if (Math.abs(dx) > 10) { isSwiping = true; if (longPressTimer) clearTimeout(longPressTimer); }
  }

  if (isSwiping) {
    currentDx = dx; var screenW = window.innerWidth;
    
    if ((state.pointer === 0 && dx > 0) || (state.pointer === state.list.length - 1 && dx < 0)) {
      dx = dx * 0.25; 
      qCard.style.transform = 'translateX(' + dx + 'px)'; 
      pCard.style.display = 'none';
    } else {
       var targetIdx = dx < 0 ? state.pointer + 1 : state.pointer - 1;
       if (phantomLoadedFor !== targetIdx) { if(renderPhantomCard(targetIdx)) phantomLoadedFor = targetIdx; }
       
       qCard.style.transform = 'translateX(' + dx + 'px)';
       qCard.style.opacity = '1'; 
       
       if(phantomLoadedFor !== -1) {
          var pOffset = dx < 0 ? screenW + dx : -screenW + dx;
          pCard.style.transform = 'translateX(' + pOffset + 'px)';
          pCard.style.opacity = '1'; 
       }
    }
  }
}, {passive: true});

scrollArea.addEventListener('touchend', function(e) {
  if (longPressTimer) clearTimeout(longPressTimer);
  if (!isDragging) return; isDragging = false;

  if (!isLongPress && isSwiping) {
    var threshold = window.innerWidth * 0.25; if (threshold < 80) threshold = 80;
    
    qCard.style.transition = 'transform 0.25s ease-out';
    pCard.style.transition = 'transform 0.25s ease-out';

    if (currentDx < -threshold && state.pointer < state.list.length - 1) {
      qCard.style.transform = 'translateX(-100vw)'; 
      pCard.style.transform = 'translateX(0)';
      setTimeout(function() { 
        windowSlideDirection = 'swipe_snap'; 
        nextQ(); // 里面已经包含了自动回到顶部的代码
        resetPhantom(); 
      }, 250);
    } else if (currentDx > threshold && state.pointer > 0) {
      qCard.style.transform = 'translateX(100vw)'; 
      pCard.style.transform = 'translateX(0)';
      setTimeout(function() { 
        windowSlideDirection = 'swipe_snap'; 
        prevQ(); // 里面已经包含了自动回到顶部的代码
        resetPhantom(); 
      }, 250);
    } else {
      qCard.style.transform = 'translateX(0)'; 
      if(phantomLoadedFor !== -1) pCard.style.transform = 'translateX(' + (currentDx < 0 ? window.innerWidth : -window.innerWidth) + 'px)';
      setTimeout(resetPhantom, 250);
    }
  } else if (isSwiping) {
      qCard.style.transition = 'transform 0.25s ease-out';
      qCard.style.transform = 'translateX(0)'; 
      setTimeout(resetPhantom, 250);
  }
  isSwiping = false;
}, {passive: true});

function resetPhantom() {
  pCard.style.display = 'none'; pCard.style.transition = 'none'; phantomLoadedFor = -1;
}

/* ==========================================================
   KEYBOARD SHORTCUTS
========================================================== */
function handleKey(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  var k = e.key.toUpperCase();
  if (k === 'ARROWRIGHT' || k === 'ENTER') { nextQ(); return; }
  if (k === 'ARROWLEFT') { prevQ(); return; }
  if (k === 'S') { toggleStar(); return; }

  var id = state.list[state.pointer];
  if (id === undefined) return;
  var order = (state.shuffled && state.optionMaps[id]) ? state.optionMaps[id] : quizData[id].opts.map(function(_, i){ return i; });
  var map = { '1': 0, 'A': 0, '2': 1, 'B': 1, '3': 2, 'C': 2, '4': 3, 'D': 3, '5': 4, 'E': 4 };
  var visIdx = map[k];
  if (visIdx !== undefined && visIdx < order.length) {
    var btns = document.querySelectorAll('.opt-btn');
    if (btns[visIdx]) btns[visIdx].click();
  }
}

window.onload = init;
</script>
